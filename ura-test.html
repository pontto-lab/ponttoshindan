<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️ あなたの【裏の顔】診断 | ぽんっとラボ</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; text-align:center; }
h1 { font-size:26px; margin-bottom:12px; color:#5e35b1; }
.question { font-size:16px; margin:24px 0 12px; font-weight: bold; min-height: 3em; display: flex; align-items: center; justify-content: center; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#ede7f6; box-shadow:0 4px 10px rgba(0,0,0,0.06); font-size:15px; cursor:pointer; transition:0.2s; color: #333; }
.options button:hover { transform: scale(1.03); background: #d1c4e9; }
.options button:active { transform: scale(0.97); }
#result { font-size:18px; margin-top:32px; }
#back { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:16px; background:#fce4ec; text-decoration:none; color:#333; font-weight: bold; border: 2px solid #ffc1e3; }
#loading { font-size:24px; margin-top:32px; color:#5e35b1; font-weight:bold; display:none; }
.result-name { font-size: 24px; color: #ff1493; margin: 10px 0; font-weight: bold; }
</style>
</head>
<body>
<div class="wrapper">
<h1>👁️ あなたの【裏の顔】診断</h1>

<div id="quiz">
<p class="question" id="question"></p>
<div id="options" class="options"></div>
</div>

<div id="loading">心の裏側をスキャン中…👁️</div>
<div id="result"></div>
<a href="index.html" id="back" style="display:none;">🏠 ぽんっとTOPにもどる</a>
</div>

<script>
// 質問と、その質問に合った回答のセット（裏の顔Ver.）
const quizData = [
  {
    q: "友達が自分より高いプレゼントをもらっていたら？",
    a: [
      { t: "angel", text: "「いいなー！」と純粋に喜ぶ" },
      { t: "devil", text: "内心「私の方が似合うのに」と思う" },
      { t: "black", text: "値段をこっそりネットで調べる" },
      { t: "king",  text: "「よかったね」と言いつつ自分も買う" }
    ]
  },
  {
    q: "行列で前の人が割り込んできたら、どうする？",
    a: [
      { t: "angel", text: "「並んでますよ」と優しく注意する" },
      { t: "devil", text: "ムスッとしてSNSに愚痴を書く" },
      { t: "black", text: "聞こえない程度の音量で舌打ちする" },
      { t: "king",  text: "無言で背後に立って圧をかける" }
    ]
  },
  {
    q: "「秘密だよ」と言われた話。あなたならどうする？",
    a: [
      { t: "angel", text: "絶対に誰にも言わず墓場まで持っていく" },
      { t: "devil", text: "信頼できる親友一人にだけ話す" },
      { t: "black", text: "「誰にも言わないでね」と前置きして話す" },
      { t: "king",  text: "こっそり自分のためのネタとしてキープ" }
    ]
  },
  {
    q: "苦手な人が大きなミスをして困っているよ。",
    a: [
      { t: "angel", text: "過去は忘れて、迷わず助ける" },
      { t: "devil", text: "「自業自得かな」と遠くから見守る" },
      { t: "black", text: "助けるふりをして優越感に浸る" },
      { t: "king",  text: "忙しいふりをしてそのまま通り過ぎる" }
    ]
  },
  {
    q: "SNSでキラキラしてる知り合いを見ると？",
    a: [
      { t: "angel", text: "「すごいな！」と素直に憧れる" },
      { t: "devil", text: "「加工かな？」と画像を拡大して確認する" },
      { t: "black", text: "とりあえず「いいね」して心の中ではスルー" },
      { t: "king",  text: "見たくないのでそっとミュートする" }
    ]
  }
];

const results = [
  { name:"純白のエンジェル度100%👼", desc:"裏も表もない、本当に心の綺麗なあなた。眩しすぎて周りが直視できないかも！" },
  { name:"ちゃっかり小悪魔度40%😈", desc:"少しだけ自分に正直なタイプ。可愛げのあるワガママで世渡り上手なあなたです。" },
  { name:"隠れ腹黒策士度70%🐍", desc:"表向きはニコニコ、心の中では冷静に分析。実は一番の切れ者かもしれません。" },
  { name:"漆黒の闇の帝王度100%🖤", desc:"裏の顔がもはやメイン。誰にも支配されない、圧倒的な自分軸を持っているカリスマです。" }
];

let current = 0;
let scores = { angel:0, devil:0, black:0, king:0 };
let quizOrder = [];

function initQuiz() {
  quizOrder = [...Array(quizData.length).keys()].sort(() => Math.random() - 0.5);
  showQuestion();
}

function showQuestion() {
  const data = quizData[quizOrder[current]];
  document.getElementById("question").innerText = data.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  const shuffledA = [...data.a].sort(() => Math.random() - 0.5);

  shuffledA.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;
    btn.onclick = () => {
      scores[choice.t]++;
      nextQuestion();
    };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {
  current++;
  if (current < quizData.length) {
    showQuestion();
  } else {
    showLoading();
  }
}

function showLoading() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setTimeout(showResult, 1500);
}

function showResult() {
  document.getElementById("loading").style.display = "none";
  let maxType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
  
  let resultData;
  if (maxType === 'angel') resultData = results[0];
  else if (maxType === 'devil') resultData = results[1];
  else if (maxType === 'black') resultData = results[2];
  else resultData = results[3];

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = `
    <p style="font-size: 20px;">あなたの正体は…✨</p>
    <div class="result-name">${resultData.name}</div>
    <p style="line-height: 1.6;">${resultData.desc}</p>
  `;
  document.getElementById("back").style.display = "inline-block";
}

initQuiz();
</script>
</body>
</html>
