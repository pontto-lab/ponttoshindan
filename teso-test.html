<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>✋ 🔎手相で見る2026年の運勢 | ぽんっとラボ</title>
<style>
/* スタイルは前回のデザインを継承 */
body { font-family:'ヒラギノ丸ゴ Pro','sans-serif'; background:#1a0b2e; color:#fff; text-align:center; margin:0; padding:15px; }
.wrapper { max-width:420px; margin:0 auto; }
h1 { font-size:18px; color:#e1bee7; margin-bottom:15px; }

#upload-area { background:#2e1a4a; padding:20px; border-radius:20px; border:2px dashed #ba68c8; }
#preview-container { position:relative; display:none; width:100%; max-width:280px; margin:15px auto; overflow:hidden; border-radius:15px; }
#user-photo { width:100%; height:auto; display:block; }

/* 低速スキャン */
.scan-line {
    position: absolute; top:0; left:0; width:100%; height:4px;
    background:rgba(0, 255, 255, 0.7); box-shadow:0 0 15px #0ff;
    animation: scanMove 3.3s linear infinite; display:none;
}
@keyframes scanMove { 0% { top:0%; } 100% { top:100%; } }

.btn-upload { background:#ba68c8; color:#fff; padding:15px 25px; border-radius:30px; font-weight:bold; cursor:pointer; display:inline-block; margin:10px 0; font-size:16px; }
input[type="file"] { display:none; }
#status-msg { margin-top:10px; font-size:13px; color:#e1bee7; min-height:1.5em; font-weight:bold; }

#result-area { display:none; background:#fff; color:#333; padding:15px; border-radius:20px; }
.hand-overlay-container { position: relative; width: 100%; max-width: 260px; margin: 0 auto 10px; border-radius: 15px; overflow: hidden; background: #000; }
#result-hand-bg { width: 100%; display: block; filter: brightness(0.7); }
#teso-line-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 2s ease-in; }

.result-name { font-size: 18px; font-weight: bold; color: #ff1493; margin: 8px 0; }
.result-desc { font-size: 13px; line-height: 1.5; color: #444; background: #f5f0ff; padding: 12px; border-radius: 12px; text-align: left; }

/* アフィリエイト枠 */
.ad-box { background:#fffcf5; border:1px solid #ffd700; border-radius:12px; padding:10px; margin-top:15px; }
.ad-box a { text-decoration:none; color:#d2691e; font-weight:bold; font-size:11px; display: block; line-height: 1.2; }
.ad-box img { width: 90px; height: 90px; border-radius: 8px; margin-bottom: 5px; }

.share-buttons { display: flex; justify-content: center; gap: 5px; margin-top: 15px; }
.btn-share { flex: 1; padding: 10px; border-radius: 10px; color: white; font-size: 11px; text-decoration: none; font-weight: bold; }
.btn-x { background:#000; } .btn-line { background:#06C755; }
.btn-retry { margin-top:10px; color:#9575cd; cursor:pointer; background:none; border:none; font-size:12px; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrapper">
    <h1>🔎 手相で見る2026年の運勢 ✋</h1>
    <div id="upload-area">
        <label class="btn-upload">📸 手を撮影する<input type="file" accept="image/*" onchange="handleFile(event)"></label>
        <div id="preview-container"><img id="user-photo" src=""><div id="scan-line" class="scan-line"></div></div>
        <div id="status-msg"></div>
    </div>
    <div id="result-area">
        <div class="hand-overlay-container"><img id="result-hand-bg" src=""><img id="teso-line-img" src=""></div>
        <div id="result-name" class="result-name"></div>
        <div id="result-desc" class="result-desc"></div>
        <div id="ad-space" class="ad-box"></div>
        <div class="share-buttons">
            <a id="share-x" href="" target="_blank" class="btn-share btn-x">𝕏 ポスト</a>
            <a id="share-line" href="" target="_blank" class="btn-share btn-line">LINE</a>
        </div>
        <button onclick="location.reload()" class="btn-retry">🔄 もう一度占う</button>
    </div>
</div>

        '<a href="//af.moshimo.com/af/c/click?a_id=5322069&p_id=54&pc_id=54&pl_id=616&url=https%3A%2F%2Fitem.rakuten.co.jp%2Fsaifuland%2Fbysa011025%2F" rel="nofollow"><img src="//thumbnail.image.rakuten.co.jp/@0_mall/saifuland/cabinet/bysa011/bysa011025.jpg?_ex=128x128"><br>3Dレーザー彫 神龍 水晶玉</a>',
        '<a href="//af.moshimo.com/af/c/click?a_id=5322069&p_id=54&pc_id=54&pl_id=616&url=https%3A%2F%2Fitem.rakuten.co.jp%2Fparkerofficial%2F10000241%2F" rel="nofollow"><img src="//thumbnail.image.rakuten.co.jp/@0_mall/parkerofficial/cabinet/07474156/11881629/imgrc0187445337.jpg?_ex=128x128"><br>成功者の筆記具 PARKER ソネット</a>'
    ],
    love: [
        '<a href="//af.moshimo.com/af/c/click?a_id=5322069&p_id=54&pc_id=54&pl_id=616&url=https%3A%2F%2Fitem.rakuten.co.jp%2Fapeacefulworld%2Fapw-003%2F" rel="nofollow"><img src="//thumbnail.image.rakuten.co.jp/@0_mall/apeacefulworld/cabinet/apw-003/apw-003-01.jpg?_ex=128x128"><br>LOVE フレグランスミスト</a>',

    ],
    reset: [
        '<a href="//af.moshimo.com/af/c/click?a_id=5322069&p_id=54&pc_id=54&pl_id=616&url=https%3A%2F%2Fitem.rakuten.co.jp%2Flucas%2Flucas-pocket%2F" rel="nofollow"><img src="//thumbnail.image.rakuten.co.jp/@0_mall/lucas/cabinet/lucas2/pocket4_top.jpg?_ex=128x128"><br>ホワイトセージ 浄化スプレー</a>',

    ]

const handsData = [
    { id: "hao", name: "最強の覇王線", category: "money", desc: "仕事・金運すべてを掴む年。最強の相応しいアイテムを。" },
    { id: "mote", name: "モテ期到来線", category: "love", desc: "愛が溢れる1年。素敵なご縁を逃さない準備を。" },
    { id: "life", name: "二重生命線", category: "health", desc: "活力が湧く年！体のケアがさらなる福を呼びます。" },
    { id: "shin", name: "神秘十字線", category: "reset", desc: "直感が冴える時。空間を浄化して運気を安定させて。" },
    { id: "solo", name: "ソロモンの環", category: "reset", desc: "知恵が冴える年。吉日を知ることで好機を逃しません。" }
    // ... 必要に応じて増やしてね
];

let userImgData = "";
function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        userImgData = e.target.result;
        document.getElementById('user-photo').src = userImgData;
        document.getElementById('preview-container').style.display = 'block';
        startScanning();
    };
    reader.readAsDataURL(file);
}

function startScanning() {
    const status = document.getElementById('status-msg');
    const scanLine = document.getElementById('scan-line');
    scanLine.style.display = 'block';
    status.innerText = "手のひらをスキャン中...";
    setTimeout(() => { status.innerText = "2026年の運命線を抽出中..."; }, 3000);
    setTimeout(() => { status.innerText = "バイオリズム照合完了。"; }, 6000);
    setTimeout(() => { showResult(); }, 8000);
}

function showResult() {
    document.getElementById('upload-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    const res = handsData[Math.floor(Math.random() * handsData.length)];
    
    // 画像合成
    document.getElementById('result-hand-bg').src = userImgData;
    const lineImg = document.getElementById('teso-line-img');
    lineImg.src = res.id + "_line.png"; 
    setTimeout(() => { lineImg.style.opacity = "1"; }, 500);

    // テキスト反映
    document.getElementById('result-name').innerText = res.name;
    document.getElementById('result-desc').innerText = res.desc;

    // 🎯 カテゴリからランダムに1つ広告を出す
    const ads = adPool[res.category];
    document.getElementById('ad-space').innerHTML = `
        <p style="font-size:10px; font-weight:bold; color:#ba68c8; margin-bottom:5px;">✨ あなたへの開運アドバイス ✨</p>
        ${ads[Math.floor(Math.random() * ads.length)]}
    `;

    // SNSシェア
    const shareText = `私の2026年の手相は…【${res.name}】！✋✨\n#手相診断 #2026年の運勢 #ぽんっとラボ\n`;
    document.getElementById("share-x").href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(window.location.href)}`;
}
</script>
