<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽんっとラボ - 直感診断サイト</title>
    <style>
        body { font-family: 'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }
        
        /* ロゴ設定 */
        .logo { max-width: 100%; height: auto; margin-bottom: 10px; border-radius: 20px; }
        
        .message { font-size: 16px; line-height: 1.8; color: #555; margin-bottom: 30px; font-weight: bold; }

        /* ボタン基本スタイル */
        .button { 
            display: block; 
            margin: 15px 0; 
            padding: 20px; 
            border-radius: 50px; 
            background: #d8bfe6; 
            color: #333; 
            text-decoration: none; 
            font-size: 18px; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            transition: transform 0.2s;
            position: relative;
        }
        .button:active { transform: scale(0.95); }

        /* ✨ 裏の顔診断：Newバッジ演出（一番目立たせる！） */
        .new-badge::after {
            content: "人気No.1";
            position: absolute;
            top: -5px;
            right: 15px;
            background: #ff1493;
            color: white;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* 🔒 手相診断：準備中スタイル（目立たなくする） */
        .btn-ready {
            background: #f9f9f9 !important;
            color: #bbb !important;
            border: 2px dashed #ddd;
            box-shadow: none;
            font-size: 14px;
            margin-top: 40px; /* 少し距離を置く */
            pointer-events: none; /* クリックできないようにする */
        }

        .share-text { color: #ff69b4; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO.png" alt="ぽんっとラボ" class="logo">

        <div class="message">
            ぽぽぽぽーんっ🎉<br>
            ようこそ「ぽんっとラボ」へ💗<br>
            直感診断であなたのことを覗いちゃうよ👀 ✨<br>
            あなたのことを教えてね🥰
        </div>

        <a href="ura-test.html" class="button new-badge" style="background: #e6e6fa;">👁 あなたの【裏の顔】診断</a>
        <a href="pontto.html" class="button">💉 ぽんっと性格診断</a>
        <a href="iq-test.html" class="button">🧠 ぽんっとIQ診断</a>
        <a href="zense-test.html" class="button" style="background: #fffacd;">👶 前世のあなたは何だった？</a>
        <a href="nounai-test.html" class="button" style="background: #e0ffff;">🧠 あなたの脳内メーカー</a>

        <div class="button btn-ready">
            🚧 手相で見る2026年の運勢<br>
            <span style="font-size: 11px;">（ただいま準備中です。お楽しみに！）</span>
        </div>

        <p class="share-text">スクショしてシェアしてね💖</p>
    </div>
</body>
</html>
