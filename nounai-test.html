<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }

/* 脳の背景土台 */
#brain-display {
    position: relative;
    width: 350px; 
    height: 350px;
    margin: 20px auto;
    background-image: url('nounai_bg.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: none; /* 初期は非表示 */
}

/* ★診断結果の画像（背景として中央に配置） */
#result-bg-image {
    position: absolute;
    /* 脳の中心付近に固定 */
    top: 110px;    
    left: 175px;   
    transform: translate(-50%, -50%); /* 中心合わせ */
    width: 65px; 
    height: auto;
    z-index: 1; 
    opacity: 0.85;
}

/* ★文字を並べる範囲（白い部分だけに限定） */
#brain-inner {
    position: absolute;
    top: 40px;    /* 上端を脳内に合わせる */
    left: 95px;   /* 左端を脳内に合わせる */
    width: 170px; /* 白い部分の幅に絞る */
    height: 130px; /* 白い部分の高さに絞る */
    display: flex;
    flex-wrap: wrap;       
    justify-content: center;
    align-content: center;  
    overflow: hidden; /* 範囲外の文字を隠す */
    z-index: 10;      /* 画像より上に表示 */
    pointer-events: none;
}

.brain-label {
    display: inline-flex;
    font-weight: bold;
    color: #ff69b4;
    line-height: 0.9;
    letter-spacing: -1px;
    margin: 1px;
    /* 文字の視認性を上げる */
    text-shadow: 1px 1px 1px rgba(255,255,255,0.8);
}

/* その他スタイル */
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; cursor:pointer; }
#loading { font-size:24px; margin-top:32px; font-weight:bold; display:none; }
#result-area { display:none; margin-top:20px; }
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>
    <div id="quiz">
        <p id="q-number" style="color:#888;"></p>
        <p id="question" style="font-weight:bold; min-height:3em;"></p>
        <div id="options" class="options"></div>
    </div>
    <div id="loading">のーみそをスキャン中...🔎</div>
    <div id="result-area">
        <div id="brain-display">
            <img id="result-bg-image" src="" alt="">
            <div id="brain-inner"></div>
        </div>
        <div id="result-desc"></div>
        <br><a href="index.html">🏠 TOPへもどる</a>
    </div>
</div>

<script>
// ファイル名マップ（修正済み）
const fileNameMap = { 
    love: "kekka-love.png", 
    money: "kekka-kane.png", 
    sleep: "kekka-sleep.png", 
    sex: "kekka-h.png", 
    work: "kekka-shigoto.png", 
    none: "kekka-mu.png" 
};
const wordMap = { love: "愛", money: "金", sleep: "眠", sex: "Ｈ", work: "仕事", none: "無" };

// クイズデータ（中略：前回と同じ内容を想定）
const questions = ["休日、何を考えてる？", "欲しいものは？", "今の自分に足りないのは？", "最高のご褒美は？", "明日地球が滅びるなら？", "3億円当たったら？", "無人島に持っていくなら？", "リラックスする瞬間は？", "検索ワードの傾向は？", "今の欲を漢字一文字で？"];
const answerData = [
    {love:"好きな人", money:"貯金", sleep:"睡眠", sex:"妄想", work:"仕事", none:"無"},
    {love:"恋人", money:"大金", sleep:"安眠", sex:"刺激", work:"地位", none:"無欲"},
    {love:"愛", money:"金", sleep:"眠り", sex:"エロ", work:"やる気", none:"悟り"},
    {love:"デート", money:"買い物", sleep:"爆睡", sex:"夜の遊び", work:"出世", none:"静寂"},
    {love:"告白", money:"豪遊", sleep:"寝る", sex:"合体", work:"完遂", none:"散歩"},
    {love:"結婚資金", money:"投資", sleep:"寝具購入", sex:"豪遊", work:"起業", none:"寄付"},
    {love:"好きな人", money:"クレカ", sleep:"枕", sex:"ゴム", work:"PC", none:"体一つ"},
    {love:"ハグ", money:"記帳", sleep:"二度寝", sex:"入浴", work:"達成", none:"瞑想"},
    {love:"恋愛", money:"副業", sleep:"快眠", sex:"秘密", work:"効率", none:"なし"},
    {love:"愛", money:"金", sleep:"眠", sex:"Ｈ", work:"仕事", none:"無"}
];

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };

function showQuestion() {
    document.getElementById("q-number").innerText = `Q ${current + 1}/10`;
    document.getElementById("question").innerText = questions[current];
    const opts = document.getElementById("options");
    opts.innerHTML = "";
    Object.keys(answerData[current]).forEach(key => {
        const b = document.createElement("button");
        b.innerText = answerData[current][key];
        b.onclick = () => { scores[key]++; current++; if(current < 10) showQuestion(); else showLoading(); };
        opts.appendChild(b);
    });
}

function showLoading() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("loading").style.display = "block";
    setTimeout(showResult, 1200);
}

function showResult() {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("brain-display").style.display = "block";
    
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    const main = sorted[0];
    
    // 画像を背景中央に表示
    const bgImg = document.getElementById("result-bg-image");
    bgImg.src = fileNameMap[main];
    bgImg.onerror = function() { this.style.display='none'; }; // 万が一のエラー対策

    const inner = document.getElementById("brain-inner");
    inner.innerHTML = "";
    
    // 文字を分類ごとに、白いエリア内に収まる量（合計約140個程度）で表示
    sorted.forEach(type => {
        const count = Math.floor((scores[type] / 10) * 140); 
        for(let i=0; i < count; i++) {
            const span = document.createElement("span");
            span.className = "brain-label";
            span.innerText = wordMap[type];
            // スコアが高い文字ほど少しだけ大きくする
            const baseSize = (type === main) ? 14 : 11;
            span.style.fontSize = (Math.random() * 4 + baseSize) + "px";
            inner.appendChild(span);
        }
    });

    const descs = { love:"愛タイプ", money:"金タイプ", sleep:"眠タイプ", sex:"本能全開タイプ", work:"仕事タイプ", none:"無タイプ" };
    document.getElementById("result-desc").innerHTML = `<h2 style="color:#ff69b4;">${descs[main]}</h2>`;
}
showQuestion();
</script>
</body>
</html>
