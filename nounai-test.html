<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー | ぽんっとラボ</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; overflow-x: hidden; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; text-align:center; }
h1 { font-size:26px; margin-bottom:12px; color:#2c3e50; }
.question { font-size:16px; margin:24px 0 12px; font-weight: bold; min-height: 3em; display: flex; align-items: center; justify-content: center; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; box-shadow:0 4px 10px rgba(0,0,0,0.06); font-size:15px; cursor:pointer; transition:0.2s; color: #333; }
.options button:hover { transform: scale(1.03); background: #afeeee; }
.options button:active { transform: scale(0.97); }

#brain-container {
    position: relative;
    width: 280px;
    height: 220px;
    margin: 20px auto;
    background: #ffecf2;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    border: 4px solid #ffb6c1;
    display: none;
    overflow: hidden;
}
.brain-label {
    position: absolute;
    font-weight: bold;
    color: #ff69b4;
    transition: 0.5s;
}

#result-area { margin-top:20px; }
#back { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:16px; background:#f0f0f0; text-decoration:none; color:#333; font-weight: bold; border: 2px solid #ddd; }
#loading { font-size:24px; margin-top:32px; color:#2c3e50; font-weight:bold; display:none; }
</style>
</head>
<body>
<div class="wrapper">
<h1>🧠 あなたの脳内メーカー</h1>

<div id="quiz">
<p class="question" id="question"></p>
<div id="options" class="options"></div>
</div>

<div id="loading">脳内をスキャン中…👀</div>

<div id="result-area" style="display:none;">
    <p style="font-size: 18px;">あなたの頭の中は…✨</p>
    <div id="brain-container"></div>
    <div id="result-desc"></div>
    <a href="index.html" id="back">🏠 ぽんっとTOPにもどる</a>
</div>
</div>

<script>
// 質問リスト
const questions = [
  "今、一番やりたいことは？",
  "無人島にひとつ持っていくなら？",
  "魔法のランプにお願いするなら？",
  "明日、地球が滅びるとしたら？",
  "自分への最高のご褒美は？"
];

// カテゴリごとの回答プール（ボリュームを大幅に増やしたよ！）
const answerData = [
  { // Q1
    money: ["宝くじで一攫千金", "株価の爆上がりを待つ", "ATMの残高を増やす魔法"],
    love:  ["推しと結婚する", "デートの計画を練る", "好きな人と目が合う"],
    sleep: ["泥のように15時間眠る", "高級ベッドで爆睡", "お布団と親友になる"],
    play:  ["世界一周旅行に出る", "朝まで飲み明かす", "テーマパークを貸し切る"]
  },
  { // Q2
    money: ["パンパンの財布", "換金できる金塊", "ブラックカード"],
    love:  ["大好きな人の写真", "お揃いのアクセサリー", "愛のメッセージカード"],
    sleep: ["最高級の羽毛布団", "お気に入りの枕", "アイマスクと耳栓セット"],
    play:  ["最新のゲーム機", "一生分の漫画本", "大量のポテトチップス"]
  },
  { // Q3
    money: ["一生遊べる不労所得", "庭から石油が出る", "買い物ですべてタダになる"],
    love:  ["運命の人を連れてきて", "全人類に愛される魔法", "好きな人の記憶に残る"],
    sleep: ["3秒で爆睡できる能力", "疲れを感じない体", "一生眠らなくていい体力"],
    play:  ["毎日が日曜日の世界", "どこでもドアで遊びたい", "透明人間になって遊ぶ"]
  },
  { // Q4
    money: ["全財産を使い切る", "銀行に立てこもる", "高い寿司を食べまくる"],
    love:  ["愛する人に告白する", "家族と一緒に過ごす", "元カレ元カノに電話する"],
    sleep: ["家でゴロゴロ寝て待つ", "いつも通り昼寝する", "最後に最高の夢を見る"],
    play:  ["豪華なパーティーを開く", "やりたい放題暴れる", "ジェットコースターに乗る"]
  },
  { // Q5
    money: ["貯金額を眺める", "デパコスを大人買い", "ハイブランドの新作"],
    love:  ["推しの限定ライブ", "豪華ディナーデート", "ラブレターをもらう"],
    sleep: ["1日中パジャマで過ごす", "昼下がりの二度寝", "スマホの電源を切る"],
    play:  ["弾丸で海外旅行", "遊園地で遊びまくる", "カラオケで100点取る"]
  }
];

const wordMap = { money: "金", love: "愛", sleep: "眠", play: "欲" };
const descMap = {
  money: "今はとにかく「現実」を大事にしたい時期！お財布が潤うと心も潤うタイプです。",
  love: "心の中は「好き」でいっぱい！推しや大切な存在があなたのエネルギー源です。",
  sleep: "お疲れ気味かも？今はとにかく「癒やし」と「休息」を頭が求めています。",
  play: "エネルギーが有り余ってる！楽しいこと、刺激的なことを常に探しています。"
};

let current = 0;
let scores = { money:0, love:0, sleep:0, play:0 };
let quizOrder = [...Array(questions.length).keys()].sort(() => Math.random() - 0.5);

function showQuestion() {
  const qIdx = quizOrder[current];
  document.getElementById("question").innerText = questions[qIdx];
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  const currentPool = answerData[qIdx];
  const choices = [
    { t: "money", text: currentPool.money[Math.floor(Math.random() * currentPool.money.length)] },
    { t: "love",  text: currentPool.love[Math.floor(Math.random() * currentPool.love.length)] },
    { t: "sleep", text: currentPool.sleep[Math.floor(Math.random() * currentPool.sleep.length)] },
    { t: "play",  text: currentPool.play[Math.floor(Math.random() * currentPool.play.length)] }
  ].sort(() => Math.random() - 0.5);

  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;
    btn.onclick = () => { scores[choice.t]++; nextQuestion(); };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {
  current++;
  if (current < questions.length) showQuestion(); else showLoading();
}

function showLoading() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setTimeout(showResult, 1500);
}

function showResult() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("result-area").style.display = "block";
  const brain = document.getElementById("brain-container");
  brain.style.display = "block";
  brain.innerHTML = ""; 
  
  const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const mainType = sorted[0];

  for (let i = 0; i < 40; i++) { // 文字の数も少し増やして賑やかにしたよ！
    const label = document.createElement("div");
    label.className = "brain-label";
    const type = Math.random() < 0.6 ? mainType : sorted[Math.floor(Math.random() * 4)];
    label.innerText = wordMap[type];
    label.style.left = Math.random() * 80 + 10 + "%";
    label.style.top = Math.random() * 70 + 15 + "%";
    label.style.fontSize = (Math.random() * 24 + 12) + "px";
    label.style.opacity = Math.random() * 0.8 + 0.2;
    brain.appendChild(label);
  }

  document.getElementById("result-desc").innerHTML = `
    <h2 style="color:#ff69b4;">${wordMap[mainType]}タイプ</h2>
    <p>${descMap[mainType]}</p>
  `;
}

showQuestion();
</script>
</body>
</html>
