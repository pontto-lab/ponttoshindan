<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー | ぽんっとラボ</title>
<script src="ads-list.js"></script>
<style>
/* 既存のスタイルを継承 */
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; overflow-x: hidden; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }

#result-area, #loading-screen { display:none; margin-top:20px; }
#result-file-display { max-width: 100%; height: auto; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
.result-comment { margin-top: 25px; font-size: 20px; font-weight: bold; color: #ff69b4; line-height: 1.6; }
.options { display:flex; flex-direction:column; gap:10px; margin-top: 20px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; cursor:pointer; font-weight: bold; font-size: 16px; }

#loading-screen { padding: 20px; background: #fffafb; border: 2px solid #ffeef2; border-radius: 20px; }
.progress-container { width: 100%; background: #eee; height: 15px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
#progress-bar { width: 0%; background: #ff69b4; height: 100%; transition: width 3s linear; }

/* 広告枠のデザインを調整 */
.ad-box { margin: 20px 0; padding: 10px; background: #fff; border: 1px dashed #ffb6c1; border-radius: 10px; min-height: 140px; }
.ad-box img { width: 100px !important; height: 100px !important; border-radius: 8px; margin-bottom: 5px; }
.ad-box a { text-decoration: none; color: #d2691e; font-size: 11px; font-weight: bold; display: block; }

.result-view-btn { display: none; width: 100%; padding: 16px; background: #ff69b4; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #d44d8c; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
.back-home { display: inline-block; margin-top: 20px; padding: 12px 40px; background-color: #f0f0f0; color: #666; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 16px; border: 1px solid #ddd; }
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>

    <div id="quiz">
        <p id="q-number" style="color:#888; font-size:12px;"></p>
        <p id="question" style="font-weight:bold; min-height:4em; font-size:18px; display:flex; align-items:center; justify-content:center; padding: 0 10px;"></p>
        <div id="options" class="options"></div>
    </div>

    <div id="loading-screen">
        <h2 style="color: #ff69b4; font-size: 20px;">🧠 あなたの脳内をスキャン中...</h2>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div id="loading-ad-area" class="ad-box">
            </div>

        <button id="result-view-btn" class="result-view-btn" onclick="showResult()">鑑定結果を表示する✨</button>
    </div>

    <div id="result-area">
        <img id="result-file-display" src="" alt="診断結果画像">
        <div id="result-comment" class="result-comment"></div>
        
        <div id="result-ad-area"></div>

        <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center;">
            <a href="javascript:location.reload();" style="color:#ff69b4; text-decoration:none; font-weight:bold; font-size:14px;">🔄 もう一度診断する</a>
            <a href="index.html" class="back-home">🏠 ぽんっとTOPにもどる</a>
        </div>
    </div>
</div>

<script>
// --- ゲームデータ部分はそのまま ---
const resultData = {
    work:  { img: "kekka-shigoto.png", msg: "君の脳内はこれ一色！<br>「THE！仕事！！」", cat: "money" },
    love:  { img: "kekka-love.png",    msg: "溢れ出す想いが止まらない！<br>「愛・愛・愛の嵐！！」", cat: "love" },
    sleep: { img: "kekka-sleep.png",   msg: "もはや立って寝てるかも！？<br>「おやすみ3秒前！！」", cat: "health" },
    sex:   { img: "kekka-h.png",       msg: "本能の赴くままに突き進め！<br>「Ｈな妄想フルスロットル！！」", cat: "love" },
    money: { img: "kekka-kane.png",    msg: "頭の中はそろばんの音だけ！<br>「金・金・金！強欲モード！！」", cat: "money" },
    none:  { img: "kekka-mu.png",      msg: "もはや悟りの境地・・・<br>「完全なる無！！！」", cat: "health" }
};

const questions = ["休日、気づいたら何を考えてる？", "魔法のランプにお願いするなら？", "今の自分に一番足りないものは？", "自分への最高のご褒美は？", "明日、地球が滅びるとしたら？", "宝くじで3億円当たったらどうする？", "無人島に一つだけ持っていくなら？", "一番リラックスできる瞬間は？", "最近、検索したワードの傾向は？", "今のあなたの「欲」を漢字一文字で言うと？"];
const answerData = [{love:"好きな人", money:"貯金", sleep:"睡眠", sex:"妄想", work:"仕事", none:"無"},{love:"運命の人", money:"大金", sleep:"安眠", sex:"刺激", work:"地位", none:"無欲"},{love:"愛", money:"金", sleep:"眠り", sex:"エロ", work:"やる気", none:"悟り"},{love:"デート", money:"買い物", sleep:"爆睡", sex:"夜の遊び", work:"出世", none:"静寂"},{love:"告白", money:"豪遊", sleep:"寝る", sex:"合体", work:"完遂", none:"散歩"},{love:"結婚資金", money:"投資", sleep:"寝具購入", sex:"豪遊", work:"起業", none:"寄付"},{love:"好きな人", money:"クレカ", sleep:"枕", sex:"ゴム", work:"PC", none:"体一つ"},{love:"ハグ", money:"記帳", sleep:"二度寝", sex:"入浴", work:"達成", none:"瞑想"},{love:"恋愛", money:"副業", sleep:"快眠", sex:"秘密", work:"効率", none:"なし"},{love:"愛", money:"金", sleep:"眠", sex:"Ｈ", work:"仕事", none:"無"}];

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };

function showQuestion() {
    document.getElementById("q-number").innerText = `第 ${current + 1} 問 / 10`;
    document.getElementById("question").innerText = questions[current];
    const optsDiv = document.getElementById("options");
    optsDiv.innerHTML = "";
    let keys = Object.keys(answerData[current]).sort(() => Math.random() - 0.5);
    keys.forEach(key => {
        const btn = document.createElement("button");
        btn.innerText = answerData[current][key];
        btn.onclick = () => { scores[key]++; current++; if(current < 10) showQuestion(); else startLoading(); };
        optsDiv.appendChild(btn);
    });
}

// --- 4. ロード画面でランダム広告を呼び出し ---
function startLoading() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("loading-screen").style.display = "block";
    
    // 🎯 とりあえずランダムに表示
    showRandomAd('random', 'loading-ad-area');

    setTimeout(() => { document.getElementById("progress-bar").style.width = "100%"; }, 100);
    setTimeout(() => { document.getElementById("result-view-btn").style.display = "block"; }, 3000);
}

// --- 5. 結果に合わせた広告を出し分け ---
function showResult() {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    const mainType = sorted[0];
    const finalResult = resultData[mainType];
    
    document.getElementById("result-file-display").src = finalResult.img;
    document.getElementById("result-comment").innerHTML = finalResult.msg;

    // 🎯 脳内の結果に合わせた開運アイテムを表示！
    showRandomAd(finalResult.cat, 'result-ad-area');
}

showQuestion();
</script>
</body>
</html>
