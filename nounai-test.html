<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }

#brain-display {
    position: relative;
    width: 350px; 
    height: 350px;
    margin: 20px auto;
    background-image: url('nounai_bg.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: none;
}

/* ★結果画像：中心から右に2mm(約8px)、上に2mm(約8px)移動★ */
#result-bg-image {
    position: absolute;
    top: 103px; 
    left: 183px; 
    transform: translate(-50%, -50%);
    width: 65px;
    z-index: 1; 
    mix-blend-mode: multiply; 
    opacity: 0.8;
}

/* ★フォントの描画エリア：白いステージ★ */
#brain-inner {
    position: absolute;
    top: 45px;    
    left: 100px;  
    width: 160px; 
    height: 130px; 
    z-index: 10;
    pointer-events: none;
    /* 子要素を自由配置するために相対位置に */
}

.brain-label {
    position: absolute; /* ★ここが重要！★ */
    font-weight: bold;
    color: #ff69b4;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0px 0px 2px rgba(255,255,255,0.8);
}

.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; cursor:pointer; font-weight: bold; }
#loading { font-size:24px; margin-top:32px; font-weight:bold; display:none; }
#result-area { display:none; margin-top:20px; }
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>
    <div id="quiz">
        <p id="q-number" style="color:#888; font-size:12px;"></p>
        <p id="question" style="font-weight:bold; min-height:4em; display:flex; align-items:center; justify-content:center;"></p>
        <div id="options" class="options"></div>
    </div>
    <div id="loading">のーみそを解析中...🔎</div>
    <div id="result-area">
        <div id="brain-display">
            <img id="result-bg-image" src="" alt="">
            <div id="brain-inner"></div>
        </div>
        <div id="result-desc"></div>
        <br><a href="index.html" style="text-decoration:none; color:#999;">🏠 TOPへもどる</a>
    </div>
</div>

<script>
const fileNameMap = { love: "kekka-love.png", money: "kekka-kane.png", sleep: "kekka-sleep.png", sex: "kekka-h.png", work: "kekka-shigoto.png", none: "kekka-mu.png" };
const wordMap = { love: "愛", money: "金", sleep: "眠", sex: "Ｈ", work: "仕事", none: "無" };

const questions = ["休日、気づいたら何を考えてる？", "魔法のランプにお願いするなら？", "今の自分に一番足りないものは？", "自分への最高のご褒美は？", "明日、地球が滅びるとしたら？", "宝くじで3億円当たったらどうする？", "無人島に一つだけ持っていくなら？", "一番リラックスできる瞬間は？", "最近、検索したワードの傾向は？", "今のあなたの「欲」を漢字一文字で言うと？"];
const answerData = [
    {love:"好きな人", money:"貯金", sleep:"睡眠", sex:"妄想", work:"仕事", none:"無"},
    {love:"運命の人", money:"大金", sleep:"安眠", sex:"刺激", work:"地位", none:"無欲"},
    {love:"愛", money:"金", sleep:"眠り", sex:"エロ", work:"やる気", none:"悟り"},
    {love:"デート", money:"買い物", sleep:"爆睡", sex:"夜の遊び", work:"出世", none:"静寂"},
    {love:"告白", money:"豪遊", sleep:"寝る", sex:"合体", work:"完遂", none:"散歩"},
    {love:"結婚資金", money:"投資", sleep:"寝具購入", sex:"豪遊", work:"起業", none:"寄付"},
    {love:"好きな人", money:"クレカ", sleep:"枕", sex:"ゴム", work:"PC", none:"体一つ"},
    {love:"ハグ", money:"記帳", sleep:"二度寝", sex:"入浴", work:"達成", none:"瞑想"},
    {love:"恋愛", money:"副業", sleep:"快眠", sex:"秘密", work:"効率", none:"なし"},
    {love:"愛", money:"金", sleep:"眠", sex:"Ｈ", work:"仕事", none:"無"}
];

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function showQuestion() {
    document.getElementById("q-number").innerText = `第 ${current + 1} 問 / 10`;
    document.getElementById("question").innerText = questions[current];
    const optsDiv = document.getElementById("options");
    optsDiv.innerHTML = "";
    let keys = shuffle(Object.keys(answerData[current]));
    keys.forEach(key => {
        const btn = document.createElement("button");
        btn.innerText = answerData[current][key];
        btn.onclick = () => { scores[key]++; current++; if(current < 10) showQuestion(); else showLoading(); };
        optsDiv.appendChild(btn);
    });
}

function showLoading() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("loading").style.display = "block";
    setTimeout(showResult, 800);
}

function showResult() {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("brain-display").style.display = "block";
    
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    const main = sorted[0];
    document.getElementById("result-bg-image").src = fileNameMap[main];

    const inner = document.getElementById("brain-inner");
    inner.innerHTML = "";
    
    // ステージ（白い部分）のサイズ
    const areaW = 160;
    const areaH = 130;

    // 文字をランダムな場所に散りばめる
    Object.keys(scores).forEach(type => {
        // スコアが多いほどたくさん表示（合計100個くらいに調整）
        const count = Math.floor((scores[type] / 10) * 80); 
        for(let i=0; i < count; i++) {
            const span = document.createElement("span");
            span.className = "brain-label";
            span.innerText = wordMap[type];
            
            // ★ランダムな位置を計算★
            const x = Math.random() * (areaW - 20); // 20は文字幅の余裕
            const y = Math.random() * (areaH - 15); // 15は文字高さの余裕
            span.style.left = x + "px";
            span.style.top = y + "px";
            
            // サイズと透明度も少しランダムにして自然に
            const baseSize = (type === main) ? 16 : 12;
            span.style.fontSize = (Math.random() * 4 + baseSize) + "px";
            span.style.opacity = Math.random() * 0.5 + 0.5;
            
            inner.appendChild(span);
        }
    });

    document.getElementById("result-desc").innerHTML = `<h2 style="color:#ff69b4;">あなたの脳内は「${wordMap[main]}」がいっぱい！</h2>`;
}
showQuestion();
</script>
</body>
</html>
