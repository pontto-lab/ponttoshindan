<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }

#brain-display {
    position: relative;
    width: 350px; 
    height: 350px;
    margin: 20px auto;
    background-image: url('nounai_bg.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: none;
}

/* ★結果画像：右に2mm(8px)・上に2mm(8px)移動★ */
#result-bg-image {
    position: absolute;
    top: 103px;    /* 111pxから8px引き上げ */
    left: 183px;   /* 175pxから8px右へ */
    transform: translate(-50%, -50%);
    width: 60px;
    height: auto;
    z-index: 1; 
    mix-blend-mode: multiply; 
    opacity: 0.9;
}

/* ★フォントの集合範囲：白いステージに最適化★ */
#brain-inner {
    position: absolute;
    top: 48px;    
    left: 102px;  
    width: 155px; 
    height: 125px; 
    display: flex;
    flex-wrap: wrap;       
    justify-content: center;
    align-content: center;  
    overflow: hidden; 
    z-index: 10;
    pointer-events: none;
}

.brain-label {
    display: inline-flex;
    font-weight: bold;
    color: #ff69b4;
    line-height: 0.8;
    letter-spacing: -1.5px;
    margin: 1px;
    text-shadow: 0px 0px 1px rgba(255,255,255,0.5);
}

.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; cursor:pointer; font-weight: bold; color: #333; transition: 0.2s; }
.options button:hover { background:#afeeee; transform: scale(1.02); }
#loading { font-size:24px; margin-top:32px; font-weight:bold; display:none; }
#result-area { display:none; margin-top:20px; }
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>
    <div id="quiz">
        <p id="q-number" style="color:#888; font-size:12px;"></p>
        <p id="question" style="font-weight:bold; min-height:3em; display:flex; align-items:center; justify-content:center;"></p>
        <div id="options" class="options"></div>
    </div>
    <div id="loading">診断中...ぽぽーん！🚀</div>
    <div id="result-area">
        <div id="brain-display">
            <img id="result-bg-image" src="" alt="">
            <div id="brain-inner"></div>
        </div>
        <div id="result-desc"></div>
        <br><a href="index.html" style="text-decoration:none; color:#999; font-weight:bold;">🏠 TOPへもどる</a>
    </div>
</div>

<script>
const fileNameMap = { love: "kekka-love.png", money: "kekka-kane.png", sleep: "kekka-sleep.png", sex: "kekka-h.png", work: "kekka-shigoto.png", none: "kekka-mu.png" };
const wordMap = { love: "愛", money: "金", sleep: "眠", sex: "Ｈ", work: "仕事", none: "無" };

const questions = ["休日、気づいたら何を考えてる？", "魔法のランプにお願いするなら？", "今の自分に一番足りないものは？", "自分への最高のご褒美は？", "明日、地球が滅びるとしたら？", "宝くじで3億円当たったらどうする？", "無人島に一つだけ持っていくなら？", "一番リラックスできる瞬間は？", "最近、検索したワードの傾向は？", "今のあなたの「欲」を漢字一文字で言うと？"];
const answerData = [
    {love:"好きな人", money:"貯金", sleep:"睡眠", sex:"妄想", work:"仕事", none:"無"},
    {love:"運命の人", money:"大金", sleep:"安眠", sex:"刺激", work:"地位", none:"無欲"},
    {love:"愛", money:"金", sleep:"眠り", sex:"エロ", work:"やる気", none:"悟り"},
    {love:"デート", money:"買い物", sleep:"爆睡", sex:"夜の遊び", work:"出世", none:"静寂"},
    {love:"告白", money:"豪遊", sleep:"寝る", sex:"合体", work:"完遂", none:"散歩"},
    {love:"結婚資金", money:"投資", sleep:"寝具購入", sex:"豪遊", work:"起業", none:"寄付"},
    {love:"好きな人", money:"クレカ", sleep:"枕", sex:"ゴム", work:"PC", none:"体一つ"},
    {love:"ハグ", money:"記帳", sleep:"二度寝", sex:"入浴", work:"達成", none:"瞑想"},
    {love:"恋愛", money:"副業", sleep:"快眠", sex:"秘密", work:"効率", none:"なし"},
    {love:"愛", money:"金", sleep:"眠", sex:"Ｈ", work:"仕事", none:"無"}
];

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };

function showQuestion() {
    document.getElementById("q-number").innerText = `第 ${current + 1} 問 / 10`;
    document.getElementById("question").innerText = questions[current];
    const optsDiv = document.getElementById("options");
    optsDiv.innerHTML = "";
    
    // ★回答をランダムに並び替えるロジック★
    const currentAns = answerData[current];
    const keys = Object.keys(currentAns);
    keys.sort(() => Math.random() - 0.5); // ここでシャッフル！

    keys.forEach(key => {
        const btn = document.createElement("button");
        btn.innerText = currentAns[key];
        btn.onclick = () => { scores[key]++; current++; if(current < 10) showQuestion(); else showLoading(); };
        optsDiv.appendChild(btn);
    });
}

function showLoading() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("loading").style.display = "block";
    setTimeout(showResult, 1000);
}

function showResult() {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("brain-display").style.display = "block";
    
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    const main = sorted[0];
    document.getElementById("result-bg-image").src = fileNameMap[main];

    const inner = document.getElementById("brain-inner");
    inner.innerHTML = "";
    
    // 文字の流し込み（分類ごとに固める）
    sorted.forEach(type => {
        const count = Math.floor((scores[type] / 10) * 125); 
        for(let i=0; i < count; i++) {
            const span = document.createElement("span");
            span.className = "brain-label";
            span.innerText = wordMap[type];
            span.style.fontSize = (Math.random() * 4 + 11) + "px";
            span.style.opacity = Math.random() * 0.4 + 0.6;
            inner.appendChild(span);
        }
    });

    const types = { love:"愛たっぷり", money:"金運重視", sleep:"お疲れ", sex:"本能全開", work:"バリバリ仕事", none:"悟りの境地" };
    document.getElementById("result-desc").innerHTML = `<h2 style="color:#ff69b4;">${types[main]}タイプ</h2>`;
}
showQuestion();
</script>
</body>
</html>
