<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー | ぽんっとラボ</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; overflow-x: hidden; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; text-align:center; }
h1 { font-size:26px; margin-bottom:12px; color:#2c3e50; }
.question { font-size:16px; margin:24px 0 12px; font-weight: bold; min-height: 3em; display: flex; align-items: center; justify-content: center; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; box-shadow:0 4px 10px rgba(0,0,0,0.06); font-size:15px; cursor:pointer; transition:0.2s; color: #333; }
.options button:hover { transform: scale(1.03); background: #afeeee; }

/* 脳内ディスプレイ（トモちゃんの画像） */
#brain-display {
    position: relative;
    width: 350px; 
    height: 350px;
    margin: 20px auto;
    background-image: url('nounai_bg.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: none;
}

/* ★5mm上に調整＆レイアウトの修正★ */
#brain-inner {
    position: absolute;
    top: 32px;    /* 前より上に引き上げたよ！ */
    left: 108px;  
    width: 185px; 
    height: 135px; 
    overflow: hidden;
    border-radius: 50%;
    display: flex;
    flex-wrap: wrap;       
    justify-content: center;
    align-content: center;  
    pointer-events: none;
}

.brain-label {
    display: inline-block;
    font-weight: bold;
    color: #ff69b4;
    padding: 1px; 
    line-height: 1;
}

/* ★主役のデカ文字：真ん中にドーン！★ */
.big-label {
    font-size: 55px !important; /* さらに大きく！ */
    color: #ff1493 !important;  
    display: block;             /* 改行させて目立たせる */
    width: 100%;               /* 真ん中を占領 */
    text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
    margin: -5px 0;            /* 隙間を詰める */
}

#result-area { margin-top:20px; }
#back { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:16px; background:#f0f0f0; text-decoration:none; color:#333; font-weight: bold; border: 2px solid #ddd; }
#loading { font-size:24px; margin-top:32px; color:#2c3e50; font-weight:bold; display:none; }
</style>
</head>
<body>
<div class="wrapper">
<h1>🧠 あなたの脳内メーカー</h1>

<div id="quiz">
<p class="question" id="question"></p>
<div id="options" class="options"></div>
</div>

<div id="loading">脳内をスキャン中…👀</div>

<div id="result-area" style="display:none;">
    <p style="font-size: 18px;">あなたの頭の中は…✨</p>
    <div id="brain-display">
        <div id="brain-inner"></div>
    </div>
    <div id="result-desc"></div>
    <a href="index.html" id="back">🏠 ぽんっとTOPにもどる</a>
</div>
</div>

<script>
const questions = ["今、一番やりたいことは？", "無人島にひとつ持っていくなら？", "魔法のランプにお願いするなら？", "明日、地球が滅びるとしたら？", "自分への最高のご褒美は？"];
const answerData = [
  { money: ["宝くじ", "株価"], love: ["結婚", "デート"], sleep: ["15時間寝る", "爆睡"], play: ["世界旅行", "飲み明かす"] },
  { money: ["財布", "金塊"], love: ["写真", "指輪"], sleep: ["羽毛布団", "枕"], play: ["ゲーム", "漫画本"] },
  { money: ["不労所得", "石油"], love: ["運命の人", "愛される"], sleep: ["爆睡能力", "疲れ知らず"], play: ["毎日休日", "どこでもドア"] },
  { money: ["爆買い", "高い寿司"], love: ["告白", "家族"], sleep: ["昼寝", "夢を見る"], play: ["パーティー", "暴れる"] },
  { money: ["貯金額", "デパコス"], love: ["ライブ", "ディナー"], sleep: ["パジャマ", "二度寝"], play: ["海外旅行", "遊園地"] }
];

const wordMap = { money: "金", love: "愛", sleep: "眠", play: "欲" };
const descMap = {
  money: "今はとにかく「現実」を大事にしたい時期！お財布が潤うと心も潤うタイプです。",
  love: "心の中は「好き」でいっぱい！推しや大切な存在があなたのエネルギー源です。",
  sleep: "お疲れ気味かも？今はとにかく「癒やし」と「休息」を頭が求めています。",
  play: "エネルギーが有り余ってる！楽しいこと、刺激的なことを常に探しています。"
};

let current = 0;
let scores = { money:0, love:0, sleep:0, play:0 };
let quizOrder = [...Array(questions.length).keys()].sort(() => Math.random() - 0.5);

function showQuestion() {
  const qIdx = quizOrder[current];
  document.getElementById("question").innerText = questions[qIdx];
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  const currentPool = answerData[qIdx];
  const choices = [
    { t: "money", text: currentPool.money[Math.floor(Math.random() * currentPool.money.length)] },
    { t: "love",  text: currentPool.love[Math.floor(Math.random() * currentPool.love.length)] },
    { t: "sleep", text: currentPool.sleep[Math.floor(Math.random() * currentPool.sleep.length)] },
    { t: "play",  text: currentPool.play[Math.floor(Math.random() * currentPool.play.length)] }
  ].sort(() => Math.random() - 0.5);
  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;
    btn.onclick = () => { scores[choice.t]++; nextQuestion(); };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {
  current++;
  if (current < questions.length) showQuestion(); else showLoading();
}

function showLoading() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setTimeout(showResult, 1500);
}

function showResult() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("result-area").style.display = "block";
  document.getElementById("brain-display").style.display = "block";
  
  const inner = document.getElementById("brain-inner");
  inner.innerHTML = ""; 
  
  const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const mainType = sorted[0];

  // ★演出ロジック★
  // まず周りの小さな文字を表示（半分）
  for (let i = 0; i < 40; i++) {
    addLabel(inner, sorted, mainType, false);
  }

  // 次にドーンとデカ文字を表示
  const bigLabel = document.createElement("span");
  bigLabel.className = "brain-label big-label";
  bigLabel.innerText = wordMap[mainType];
  inner.appendChild(bigLabel);

  // 最後に残りの小さな文字を表示（隙間埋め）
  for (let i = 0; i < 40; i++) {
    addLabel(inner, sorted, mainType, false);
  }

  document.getElementById("result-desc").innerHTML = `
    <h2 style="color:#ff69b4;">${wordMap[mainType]}タイプ</h2>
    <p>${descMap[mainType]}</p>
  `;
}

// 文字を追加する共通関数
function addLabel(container, sorted, mainType) {
    const label = document.createElement("span");
    label.className = "brain-label";
    const type = Math.random() < 0.6 ? mainType : sorted[Math.floor(Math.random() * 4)];
    label.innerText = wordMap[type];
    label.style.fontSize = (Math.random() * 8 + 12) + "px";
    label.style.opacity = Math.random() * 0.7 + 0.3;
    container.appendChild(label);
}

showQuestion();
</script>
</body>
</html>
