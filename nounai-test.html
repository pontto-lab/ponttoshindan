<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー | ぽんっとラボ</title>
<style>
/* 全体のスタイル設定 */
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; overflow-x: hidden; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }

/* 🧠 くるくる回転して登場するアニメーション */
@keyframes resultAppear {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1.1) rotate(360deg); opacity: 1; }
    100% { transform: scale(1) rotate(720deg); opacity: 1; }
}

/* 💬 下からフワッとコメントが出る演出 */
@keyframes commentFadeIn {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
}

#result-area { display:none; margin-top:20px; }

/* 結果画像の表示設定（トモちゃんの.jpg画像用） */
#result-file-display {
    max-width: 100%;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.result-animation {
    animation: resultAppear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

/* 一言コメントのスタイル */
.result-comment {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
    color: #ff69b4;
    line-height: 1.6;
    opacity: 0;
}

.comment-animation {
    animation: commentFadeIn 0.8s ease-out 1.2s forwards;
}

/* 診断中のボタンなど */
.options { display:flex; flex-direction:column; gap:10px; margin-top: 20px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; cursor:pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
.options button:hover { background:#afeeee; }

#loading { font-size:24px; margin-top:50px; font-weight:bold; display:none; color: #ff69b4; }

/* TOPへもどるボタンの装飾 */
.back-home {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 40px;
    background-color: #f0f0f0;
    color: #666;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
    font-size: 16px;
    border: 1px solid #ddd;
    transition: 0.3s;
}
.back-home:hover {
    background-color: #e0e0e0;
}
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>

    <div id="quiz">
        <p id="q-number" style="color:#888; font-size:12px;"></p>
        <p id="question" style
