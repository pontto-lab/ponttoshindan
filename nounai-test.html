<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー | ぽんっとラボ</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; overflow-x: hidden; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; text-align:center; }
h1 { font-size:26px; margin-bottom:12px; color:#2c3e50; }
.question { font-size:16px; margin:24px 0 12px; font-weight: bold; min-height: 3em; display: flex; align-items: center; justify-content: center; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; box-shadow:0 4px 10px rgba(0,0,0,0.06); font-size:15px; cursor:pointer; transition:0.2s; color: #333; }
.options button:hover { transform: scale(1.03); background: #afeeee; }

#brain-display {
    position: relative;
    width: 350px; 
    height: 350px;
    margin: 20px auto;
    background-image: url('nounai_bg.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: none;
}

#brain-inner {
    position: absolute;
    /* ★左上に2mm（約8px）ずらしたよ★ */
    top: 24px;    
    left: 100px;  
    width: 195px; 
    height: 145px; 
    overflow: hidden;
    border-radius: 50%;
    display: flex;
    flex-wrap: wrap;       
    justify-content: center;
    align-content: center;  
    pointer-events: none;
    padding: 2px;
    box-sizing: border-box;
}

.brain-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #ff69b4;
    line-height: 0.9;
    letter-spacing: -1px;
    margin: 1px;
}

/* ★デカ文字をインラインにして左右に文字が回り込むようにしたよ★ */
.big-label {
    font-size: 65px !important; 
    color: #ff1493 !important;  
    text-shadow: 2px 2px 4px rgba(255,255,255,1);
    z-index: 10;
    margin: 0 4px; /* 左右に少しだけ隙間を作って小文字を誘い込む */
}

#result-area { margin-top:20px; }
#back { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:16px; background:#f0f0f0; text-decoration:none; color:#333; font-weight: bold; border: 2px solid #ddd; }
#loading { font-size:24px; margin-top:32px; color:#2c3e50; font-weight:bold; display:none; }
</style>
</head>
<body>
<div class="wrapper">
<h1>🧠 あなたの脳内メーカー</h1>

<div id="quiz">
<p class="question" id="question"></p>
<div id="options" class="options"></div>
</div>

<div id="loading">脳内をスキャン中…👀</div>

<div id="result-area" style="display:none;">
    <p style="font-size: 18px;">あなたの頭の中は…✨</p>
    <div id="brain-display">
        <div id="brain-inner"></div>
    </div>
    <div id="result-desc"></div>
    <a href="index.html" id="back">🏠 ぽんっとTOPにもどる</a>
</div>
</div>

<script>
const questions = [
    "休日、気づいたら何を考えてる？",
    "魔法のランプにお願いするなら？",
    "今の自分に一番足りないものは？",
    "自分への最高のご褒美は？",
    "明日、地球が滅びるとしたら？"
];

const answerData = [
  { love: "推しのこと", money: "銀行の残高", sleep: "昼寝のタイミング", sex: "ムフフな妄想", work: "明日のタスク", none: "無心で壁を見る" },
  { love: "一生愛されたい", money: "油田のオーナーになる", sleep: "3秒で爆睡する能力", sex: "究極のモテ期", work: "出世街道まっしぐら", none: "煩悩を捨てたい" },
  { love: "トキメキ", money: "圧倒的な資金力", sleep: "深い眠り", sex: "刺激的な夜", work: "やる気スイッチ", none: "悟りの境地" },
  { love: "恋人と豪華ディナー", money: "宝くじで一攫千金！", sleep: "高級羽毛布団で15時間", sex: "魅惑のボディケア", work: "最新のPC", none: "デジタルデトックス" },
  { love: "家族と過ごす", money: "全財産使い切る", sleep: "そのまま永眠", sex: "本能のままに振る舞う", work: "仕事を終わらせる", none: "いつも通り過ごす" }
];

const wordMap = { love: "愛", money: "金", sleep: "眠", sex: "Ｈ", work: "仕事", none: "無" };
const descMap = {
  love: "心の中は「愛」でいっぱい！愛し愛されたいロマンチストさんです。",
  money: "今はとにかく「金」が大事！お財布の潤いが心の平和に直結します。",
  sleep: "お疲れ気味かも？頭の中はふかふかの布団のことで埋め尽くされています。",
  sex: "本能が爆発中！刺激的な何かを求めて頭がのぼせているようです。",
  work: "責任感が強すぎ！休みの日もどこかで仕事のことを考えていませんか？",
  none: "悟りを開いています。何事にも動じない、静かな精神状態にあるようです。"
};

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };
let quizOrder = [...Array(questions.length).keys()].sort(() => Math.random() - 0.5);

function showQuestion() {
  const qIdx = quizOrder[current];
  document.getElementById("question").innerText = questions[qIdx];
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  const currentPool = answerData[qIdx];
  const keys = Object.keys(currentPool);
  keys.sort(() => Math.random() - 0.5).forEach(key => {
    const btn = document.createElement("button");
    btn.innerText = currentPool[key];
    btn.onclick = () => { scores[key]++; nextQuestion(); };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {
  current++;
  if (current < questions.length) showQuestion(); else showLoading();
}

function showLoading() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setTimeout(showResult, 1500);
}

function showResult() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("result-area").style.display = "block";
  document.getElementById("brain-display").style.display = "block";
  
  const inner = document.getElementById("brain-inner");
  inner.innerHTML = ""; 
  
  const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const mainType = sorted[0];

  // ★文字を大量に生成して、途中でデカ文字を混ぜる★
  for (let i = 0; i < 150; i++) {
    if (i === 40) { // 40番目くらいにデカ文字を配置（中央付近にくる）
        const bigLabel = document.createElement("span");
        bigLabel.className = "brain-label big-label";
        bigLabel.innerText = wordMap[mainType];
        inner.appendChild(bigLabel);
    }
    const label = document.createElement("span");
    label.className = "brain-label";
    const type = Math.random() < 0.5 ? mainType : sorted[Math.floor(Math.random() * sorted.length)];
    label.innerText = wordMap[type];
    label.style.fontSize = (Math.random() * 8 + 10) + "px";
    label.style.opacity = Math.random() * 0.7 + 0.3;
    inner.appendChild(label);
  }

  document.getElementById("result-desc").innerHTML = `
    <h2 style="color:#ff69b4;">${wordMap[mainType]}タイプ</h2>
    <p>${descMap[mainType]}</p>
  `;
}

showQuestion();
</script>
</body>
</html>
