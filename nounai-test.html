<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }
h1 { font-size:26px; color:#2c3e50; margin-bottom: 20px; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; font-size:15px; cursor:pointer; transition:0.2s; }
.options button:hover { background:#afeeee; }

#brain-display {
    position: relative;
    width: 350px; 
    height: 350px;
    margin: 20px auto;
    background-image: url('nounai_bg.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: none;
}

/* ★背景画像を配置するレイヤー★ */
#result-bg-image {
    position: absolute;
    top: 50%;
    left: 50%;
    /* 10mm（約38px）右へ、少し下へ調整 */
    transform: translate(calc(-50% + 38px), -75%); 
    width: 62px; /* 3mm小さくしたサイズ */
    height: auto;
    z-index: 1; 
    opacity: 0.9;
}

/* ★文字を並べるレイヤー★ */
#brain-inner {
    position: absolute;
    top: 25px;    
    left: 90px;   
    width: 210px; 
    height: 140px; 
    display: flex;
    flex-wrap: wrap;       
    justify-content: center;
    align-content: center;  
    pointer-events: none;
    z-index: 10; /* 画像の上に重ねる */
}

.brain-label {
    display: inline-flex;
    font-weight: bold;
    color: #ff69b4;
    line-height: 0.85;
    letter-spacing: -1px;
    margin: 1px;
    text-shadow: 0px 0px 2px rgba(255,255,255,0.8); /* 画像の上でも読みやすく */
}

#loading { font-size:24px; margin-top:32px; font-weight:bold; display:none; }
#result-area { display:none; margin-top:20px; }
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>
    <div id="quiz">
        <p id="q-number" style="color:#888; font-size:14px;"></p>
        <p id="question" style="font-weight:bold; min-height:3em; padding:0 10px;"></p>
        <div id="options" class="options"></div>
    </div>
    <div id="loading">深層心理を解析中...🚀</div>
    <div id="result-area">
        <div id="brain-display">
            <img id="result-bg-image" src="" alt="">
            <div id="brain-inner"></div>
        </div>
        <div id="result-desc"></div>
        <br><a href="index.html" style="text-decoration:none; color:#666; font-weight:bold;">🏠 TOPへもどる</a>
    </div>
</div>

<script>
const fileNameMap = { love: "kekka-love.png", money: "kekka-kane.png", sleep: "kekka-sleep.png", sex: "kekka-h.png", work: "kekka-shigoto.png", none: "kekka-mu.png" };
const wordMap = { love: "愛", money: "金", sleep: "眠", sex: "Ｈ", work: "仕事", none: "無" };

const questions = [
    "休日、気づいたら何を考えてる？", "魔法のランプにお願いするなら？", "今の自分に一番足りないものは？", "自分への最高のご褒美は？", "明日、地球が滅びるとしたら？",
    "宝くじで3億円当たったらどうする？", "無人島に一つだけ持っていくなら？", "一番リラックスできる瞬間は？", "最近、検索したワードの傾向は？", "今のあなたの「欲」を漢字一文字で言うと？"
];
const answerData = [
  { love: "好きな人のこと", money: "貯金額の推移", sleep: "あと何時間寝れるか", sex: "刺激的な妄想", work: "明日の仕事の段取り", none: "特になにも考えてない" },
  { love: "運命の人に会わせて", money: "一生遊べるお金をくれ", sleep: "不眠不休でも平気な体", sex: "絶倫になりたい", work: "天才的な仕事能力", none: "無欲の境地にいかせて" },
  { love: "心の安らぎ", money: "圧倒的な軍資金", sleep: "質の高い睡眠", sex: "情熱的な体験", work: "生産性の向上", none: "執着を捨てる心" },
  { love: "大切な人と旅行", money: "欲しかった高級品を買う", sleep: "一日中パジャマで寝る", sex: "高級エステで体を磨く", work: "ハイスペックな仕事道具", none: "静かな場所で瞑想" },
  { love: "愛する人と抱き合う", money: "全財産を使い切る", sleep: "眠るように最期を迎える", sex: "本能のままに愛し合う", work: "やり残した仕事を片付ける", none: "ただ静かに空を眺める" },
  { love: "愛を育む資金にする", money: "資産運用でさらに増やす", sleep: "寝るためだけの豪邸を建てる", sex: "禁断の遊びを覚える", work: "会社を設立する", none: "半分以上寄付する" },
  { love: "恋人", money: "ゴールドカード", sleep: "最高級の枕", sex: "媚薬", work: "パソコン", none: "何も持っていかない" },
  { love: "ハグしている時", money: "通帳記帳した時", sleep: "二度寝する瞬間", sex: "お風呂でリラックス", work: "タスクが完了した時", none: "ぼーっとしている時" },
  { love: "婚活・恋愛テクニック", money: "投資・節税・副業", sleep: "快眠グッズ・マットレス", sex: "深夜の秘密のワード", work: "スキルアップ・効率化", none: "検索なんてしない" },
  { love: "愛", money: "金", sleep: "眠", sex: "Ｈ", work: "仕事", none: "無" }
];

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };

function showQuestion() {
    document.getElementById("q-number").innerText = `第 ${current + 1} 問 / 10`;
    document.getElementById("question").innerText = questions[current];
    const opts = document.getElementById("options");
    opts.innerHTML = "";
    Object.keys(answerData[current]).forEach(key => {
        const b = document.createElement("button");
        b.innerText = answerData[current][key];
        b.onclick = () => { scores[key]++; current++; if(current < 10) showQuestion(); else showLoading(); };
        opts.appendChild(b);
    });
}

function showLoading() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("loading").style.display = "block";
    setTimeout(showResult, 1500);
}

function showResult() {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("brain-display").style.display = "block";
    
    // 背景画像のセット
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    const main = sorted[0];
    document.getElementById("result-bg-image").src = fileNameMap[main];

    // 文字の流し込み（分類ごとに固める）
    const inner = document.getElementById("brain-inner");
    inner.innerHTML = "";
    
    // スコア順に並べることで、多い文字が固まって見えるようにするよ
    sorted.forEach(type => {
        const count = Math.floor((scores[type] / 10) * 150); // スコアに応じた割合で表示
        for(let i=0; i < count; i++) {
            const span = document.createElement("span");
            span.className = "brain-label";
            span.innerText = wordMap[type];
            span.style.fontSize = (Math.random() * 5 + 11) + "px";
            span.style.opacity = Math.random() * 0.5 + 0.5;
            inner.appendChild(span);
        }
    });

    const descs = { love:"愛たっぷり", money:"金運重視", sleep:"お疲れモード", sex:"本能全開", work:"仕事人間", none:"無の境地" };
    document.getElementById("result-desc").innerHTML = `<h2 style="color:#ff69b4;">${descs[main]}タイプ</h2>`;
}
showQuestion();
</script>
</body>
</html>
