<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 あなたの脳内メーカー</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; overflow-x: hidden; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; }

/* ★くるくる回転して登場するアニメーション★ */
@keyframes resultAppear {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(360deg); opacity: 1; }
    100% { transform: scale(1) rotate(720deg); opacity: 1; }
}

.result-animation {
    animation: resultAppear 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

#result-area { display:none; margin-top:20px; }

/* 結果画像の表示設定（トモちゃんのファイルをそのまま出す） */
#result-file-display {
    max-width: 100%;
    height: auto;
    margin: 0 auto;
    display: block;
}

.options { display:flex; flex-direction:column; gap:10px; margin-top: 20px; }
.options button { padding:14px; border-radius:18px; border:none; background:#e0ffff; cursor:pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
.options button:hover { background:#afeeee; }

#loading { 
    font-size:26px; 
    margin-top:50px; 
    font-weight:bold; 
    display:none; 
    color: #ff69b4;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}
</style>
</head>
<body>
<div class="wrapper">
    <h1>🧠 あなたの脳内メーカー</h1>

    <div id="quiz">
        <p id="q-number" style="color:#888;"></p>
        <p id="question" style="font-weight:bold; min-height:4em; font-size:18px; display:flex; align-items:center; justify-content:center;"></p>
        <div id="options" class="options"></div>
    </div>

    <div id="loading">あなたの脳内は・・・・！！！！🧠✨</div>

    <div id="result-area">
        <img id="result-file-display" src="" alt="結果" class="">
        <br>
        <a href="index.html" style="display:inline-block; margin-top:30px; color:#999; text-decoration:none; font-weight:bold;">🏠 もう一度診断する</a>
    </div>
</div>

<script>
// トモちゃん指定のファイル名
const fileNameMap = {
    work: "kekka-shigoto.png",
    love: "kekka-love.png",
    sleep: "kekka-sleep.png",
    sex: "kekka-h.png",
    money: "kekka-kane.png",
    none: "kekka-mu.png"
};

const questions = ["休日、気づいたら何を考えてる？", "魔法のランプにお願いするなら？", "今の自分に一番足りないものは？", "自分への最高のご褒美は？", "明日、地球が滅びるとしたら？", "宝くじで3億円当たったらどうする？", "無人島に一つだけ持っていくなら？", "一番リラックスできる瞬間は？", "最近、検索したワードの傾向は？", "今のあなたの「欲」を漢字一文字で言うと？"];
const answerData = [
    {love:"好きな人", money:"貯金", sleep:"睡眠", sex:"妄想", work:"仕事", none:"無"},
    {love:"運命の人", money:"大金", sleep:"安眠", sex:"刺激", work:"地位", none:"無欲"},
    {love:"愛", money:"金", sleep:"眠り", sex:"エロ", work:"やる気", none:"悟り"},
    {love:"デート", money:"買い物", sleep:"爆睡", sex:"夜の遊び", work:"出世", none:"静寂"},
    {love:"告白", money:"豪遊", sleep:"寝る", sex:"合体", work:"完遂", none:"散歩"},
    {love:"結婚資金", money:"投資", sleep:"寝具購入", sex:"豪遊", work:"起業", none:"寄付"},
    {love:"好きな人", money:"クレカ", sleep:"枕", sex:"ゴム", work:"PC", none:"体一つ"},
    {love:"ハグ", money:"記帳", sleep:"二度寝", sex:"入浴", work:"達成", none:"瞑想"},
    {love:"恋愛", money:"副業", sleep:"快眠", sex:"秘密", work:"効率", none:"なし"},
    {love:"愛", money:"金", sleep:"眠", sex:"Ｈ", work:"仕事", none:"無"}
];

let current = 0;
let scores = { love:0, money:0, sleep:0, sex:0, work:0, none:0 };

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function showQuestion() {
    document.getElementById("q-number").innerText = `Q ${current + 1} / 10`;
    document.getElementById("question").innerText = questions[current];
    const optsDiv = document.getElementById("options");
    optsDiv.innerHTML = "";
    let keys = shuffle(Object.keys(answerData[current]));
    keys.forEach(key => {
        const btn = document.createElement("button");
        btn.innerText = answerData[current][key];
        btn.onclick = () => { scores[key]++; current++; if(current < 10) showQuestion(); else showLoading(); };
        optsDiv.appendChild(btn);
    });
}

function showLoading() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("loading").style.display = "block";
    // 1.5秒待ってから結果を表示
    setTimeout(showResult, 1500);
}

function showResult() {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    const mainType = sorted[0];

    const resultImg = document.getElementById("result-file-display");
    resultImg.src = fileNameMap[mainType];
    
    // ★ここで回転アニメーションのクラスを追加！★
    resultImg.classList.add("result-animation");
}

showQuestion();
</script>
</body>
</html>
