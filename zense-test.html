<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👼 前世のあなたは何だった？ | ぽんっとラボ</title>
    <style>
        body { font-family: 'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background: #fffacd; text-align: center; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #ff69b4; margin-bottom: 20px; }
        .question { font-size: 18px; font-weight: bold; margin-bottom: 20px; display: none; }
        /* 4択ボタンのスタイル */
        .btn { display: block; width: 100%; margin: 10px 0; padding: 15px; border-radius: 50px; border: none; background: #d8bfe6; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { transform: scale(1.02); background: #cdafe0; }
        #result { display: none; }
        .result-title { font-size: 24px; color: #ff69b4; margin: 20px 0; font-weight: bold; }
        .result-desc { font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
        .home-btn { background: #ffb6c1; text-decoration: none; color: white; display: inline-block; padding: 15px 30px; border-radius: 50px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👼 前世診断</h1>
        
        <div id="q1" class="question" style="display: block;">
            <p>Q1. 目の前に不思議な扉が。何色？</p>
            <button class="btn" onclick="next(1, 'A')">キラキラ輝く黄金色</button>
            <button class="btn" onclick="next(1, 'B')">深い森のような緑色</button>
            <button class="btn" onclick="next(1, 'C')">吸い込まれそうな青色</button>
            <button class="btn" onclick="next(1, 'D')">可愛らしいパステルピンク</button>
        </div>

        <div id="q2" class="question">
            <p>Q2. 昔からなぜか「落ち着く」場所は？</p>
            <button class="btn" onclick="next(2, 'A')">にぎやかなお祭り会場</button>
            <button class="btn" onclick="next(2, 'B')">静かな図書館や教会</button>
            <button class="btn" onclick="next(2, 'C')">波の音が聞こえる海岸</button>
            <button class="btn" onclick="next(2, 'D')">お花がいっぱいの庭園</button>
        </div>

        <div id="q3" class="question">
            <p>Q3. 直感で選んで！今のあなたの武器は？</p>
            <button class="btn" onclick="next(3, 'A')">みんなを導くリーダーシップ</button>
            <button class="btn" onclick="next(3, 'B')">誰にも負けない集中力</button>
            <button class="btn" onclick="next(3, 'C')">自由を愛するフットワーク</button>
            <button class="btn" onclick="next(3, 'D')">人を笑顔にする不思議な魅力</button>
        </div>

        <div id="result">
            <p>あなたの前世は...</p>
            <div id="result-text" class="result-title"></div>
            <p id="result-desc" class="result-desc"></p>
            <a href="index.html" class="home-btn">トップに戻る</a>
        </div>
    </div>

    <script>
        let resultCounts = { A: 0, B: 0, C: 0, D: 0 };
        
        function next(qNum, choice) {
            resultCounts[choice]++;
            document.getElementById('q' + qNum).style.display = 'none';
            let nextQ = document.getElementById('q' + (qNum + 1));
            if (nextQ) {
                nextQ.style.display = 'block';
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('result').style.display = 'block';
            const resTitle = document.getElementById('result-text');
            const resDesc = document.getElementById('result-desc');

            // 一番多かった選択肢で判定
            let maxChoice = Object.keys(resultCounts).reduce((a, b) => resultCounts[a] > resultCounts[b] ? a : b);

            if (maxChoice === 'A') {
                resTitle.innerText = "伝説の王国の「若き王・女王」";
                resDesc.innerText = "あなたは前世、多くの民に慕われる立派なリーダーでした。今の堂々とした雰囲気は、王家の血筋の名残かもしれません！";
            } else if (maxChoice === 'B') {
                resTitle.innerText = "歴史を変えた「天才天文学者」";
                resDesc.innerText = "あなたは前世、夜空を見上げて宇宙の真理を探求していました。分析が得意なのは、星のメッセージを読んでいたからかも。";
            } else if (maxChoice === 'C') {
                resTitle.innerText = "七つの海を旅した「伝説の航海士」";
                resDesc.innerText = "あなたは前世、自由を求めて世界中の海を渡り歩いていました。冒険心が強いのは、まだ見ぬ景色を探している証拠です。";
            } else {
                resTitle.innerText = "人々に愛された「宮廷の踊り子」";
                resDesc.innerText = "あなたは前世、その美しさと表現力で国中の人々を虜にしていました。今のあなたの華やかさは、当時のステージの輝きです！";
            }
        }
    </script>
</body>
</html>
