<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👼 前世のあなたは何だった？ | ぽんっとラボ</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; text-align:center; }
h1 { font-size:26px; margin-bottom:12px; color:#e67e22; } /* 暖かみのあるオレンジ系 */
.question { font-size:16px; margin:24px 0 12px; font-weight: bold; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#fff9c4; box-shadow:0 4px 10px rgba(0,0,0,0.06); font-size:15px; cursor:pointer; transition:0.2s; color: #333; }
.options button:hover { transform: scale(1.03); background: #fff59d; }
.options button:active { transform: scale(0.97); }
#result { font-size:18px; margin-top:32px; }
#back { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:16px; background:#e1f5fe; text-decoration:none; color:#333; font-weight: bold; border: 2px solid #81d4fa; }
#loading { font-size:24px; margin-top:32px; color:#e67e22; font-weight:bold; display:none; }
.result-name { font-size: 24px; color: #ff8f00; margin: 10px 0; font-weight: bold; }
</style>
</head>
<body>
<div class="wrapper">
<h1>👼 前世のあなたは何だった？</h1>

<div id="quiz">
<p class="question" id="question"></p>
<div id="options" class="options"></div>
</div>

<div id="loading">時空をさかのぼり中…⏳✨</div>
<div id="result"></div>
<a href="index.html" id="back" style="display:none;">🏠 ぽんっとTOPにもどる</a>
</div>

<script>
// 不思議な前世質問リスト
const questions = [
  "森の奥で古い扉を見つけたよ。どうする？",
  "夜空にひときわ輝く星が。あれは何だと思う？",
  "不思議な力を持つ宝石。何色を選びたい？",
  "旅の途中で出会った動物が話しかけてきたよ。",
  "夢の中で見た、忘れられない景色は？",
  "もし魔法がひとつだけ使えるなら？",
  "古い図書館で見つけた、ボロボロの地図。"
];

// 回答プール（カテゴリ別：ロイヤル、魔法、自由、ユニーク）
const answerPool = {
  royal: ["迷わず開けて中を確認する", "未来を映す鏡", "高貴な金色", "「私を城へ連れて行って」", "豪華な宮殿の広間", "世界を平和にする魔法", "自分の国を探す"],
  magic: ["呪文を唱えてみる", "伝説の魔法の杖", "神秘的な紫色", "不思議な予言を聞く", "静かな夜の湖畔", "空を自由に飛ぶ魔法", "隠された宝の場所を解く"],
  free:  ["風の向くままに通り過ぎる", "自由な鳥の羽", "爽やかな青色", "一緒に昼寝をする", "果てしなく続く草原", "動物と話せる魔法", "まだ誰も知らない島へ行く"],
  unique:["とりあえずノックして挨拶", "美味しそうな大きな飴玉", "派手な虹色", "面白いジョークを教わる", "賑やかな市場の風景", "一生お腹が空かない魔法", "美味しいパン屋さんを探す"]
};

// 前世の結果タイプ
const results = [
  { name:"誇り高き伝説の騎士⚔️", desc:"前世のあなたは、多くの人を守った英雄でした。その勇気は今も魂に刻まれています！" },
  { name:"月夜に踊る大魔法使い🧙‍♀️", desc:"不思議な力を操り、世界を旅していたあなた。今の直感の鋭さは、その時の名残かも。" },
  { name:"風と旅した自由な吟遊詩人🎶", desc:"どこにも縛られず、歌と共に生きたあなた。あなたの明るさは、周りの人を幸せにします。" },
  { name:"実は…とっても愛された子犬🐶", desc:"前世はみんなに可愛がられていたワンちゃんでした。愛され力は今世でも最強です！" }
];

let current = 0;
let scores = { royal:0, magic:0, free:0, unique:0 };
let quizOrder = [];

function initQuiz() {
  quizOrder = [...Array(questions.length).keys()].sort(() => Math.random() - 0.5);
  showQuestion();
}

function showQuestion() {
  const qText = questions[quizOrder[current]];
  document.getElementById("question").innerText = qText;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  const choices = [
    { type: 'royal',  text: answerPool.royal[Math.floor(Math.random() * answerPool.royal.length)] },
    { type: 'magic',  text: answerPool.magic[Math.floor(Math.random() * answerPool.magic.length)] },
    { type: 'free',   text: answerPool.free[Math.floor(Math.random() * answerPool.free.length)] },
    { type: 'unique', text: answerPool.unique[Math.floor(Math.random() * answerPool.unique.length)] }
  ].sort(() => Math.random() - 0.5);

  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;
    btn.onclick = () => {
      scores[choice.type]++;
      nextQuestion();
    };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {
  current++;
  if (current < 5) {
    showQuestion();
  } else {
    showLoading();
  }
}

function showLoading() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setTimeout(showResult, 1500);
}

function showResult() {
  document.getElementById("loading").style.display = "none";
  let maxType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
  
  let resultData;
  if (maxType === 'royal') resultData = results[0];
  else if (maxType === 'magic') resultData = results[1];
  else if (maxType === 'free') resultData = results[2];
  else resultData = results[3];

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = `
    <p style="font-size: 20px;">あなたの前世は…✨</p>
    <div class="result-name">${resultData.name}</div>
    <p style="line-height: 1.6;">${resultData.desc}</p>
  `;
  document.getElementById("back").style.display = "inline-block";
}

initQuiz();
</script>
</body>
</html>
