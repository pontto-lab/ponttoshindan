<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 あなたの前世診断 | ぽんっとラボ</title>
    <script src="ads-list.js"></script>
    <style>
        body { font-family: 'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background: #fdfaf5; text-align: center; margin: 0; padding: 20px; color: #5d4037; }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { color: #8e44ad; font-size: 24px; margin-bottom: 20px; }
        .quiz-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 2px solid #eee8f3; }
        .button { display: block; width: 100%; margin: 12px 0; padding: 16px; border-radius: 30px; background: #f3e5f5; color: #6a1b9a; text-decoration: none; font-size: 16px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .button:hover { background: #e1bee7; }
        #loading-screen, #result-screen { display: none; }
        .progress-container { width: 100%; background: #eee; height: 12px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-bar { width: 0%; background: #9b59b6; height: 100%; transition: width 3s linear; }
        .ad-box { background: #fff; padding: 10px; border: 2px dashed #d1c4e9; margin: 20px 0; border-radius: 15px; min-height: 140px; }
        .result-img { width: 100%; max-width: 300px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .result-title { font-size: 24px; font-weight: bold; color: #8e44ad; margin-bottom: 10px; }
        .result-text { font-size: 16px; line-height: 1.7; margin-bottom: 25px; text-align: left; background: white; padding: 15px; border-radius: 15px; border: 1px solid #eee; }

        /* ✨ ボタンコンテナ */
        .btn-container { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 20px; }
        .btn-retry { color: #8e44ad; font-size: 16px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; background: none; }
        .other-test-btn { display: inline-block; padding: 12px 30px; background: #fff; color: #8e44ad; border: 2px solid #8e44ad; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .other-test-btn:hover { background: #8e44ad; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 あなたの前世診断</h1>
        
        <div id="quiz-screen" class="quiz-card">
            <p id="q-number" style="color:#9b59b6; font-size:14px; font-weight:bold;"></p>
            <h2 id="question" style="font-size:18px; margin: 20px 0;"></h2>
            <div id="options"></div>
        </div>

        <div id="loading-screen">
            <h2 style="color: #8e44ad;">前世の記憶を呼び戻しています...</h2>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div id="loading-ad-area" class="ad-box"></div>
            <button id="result-view-btn" class="button" style="display:none; background:#8e44ad; color:white;" onclick="showResult()">✨ 記憶をのぞく ✨</button>
        </div>

        <div id="result-screen">
            <h2 style="color: #8e44ad; font-size: 18px;">あなたの前世は...</h2>
            <img id="result-image" class="result-img" src="" alt="前世の結果">
            
            <div id="result-title" class="result-title"></div>
            <div id="result-text" class="result-text"></div>
            
            <div id="result-ad-area"></div>
            
            <div class="btn-container">
                <button class="btn-retry" onclick="location.reload()">🔄 もう一度診断する</button>
                <a href="index.html" class="other-test-btn">🌈 ほかの診断もあそぶ？</a>
            </div>
        </div>
    </div>

    <script>
        // 🎯 ここを準備したイラストのファイル名と一致させています
        const results = {
            purple: { 
                title: "高貴な巫女・賢者", 
                img: "zense-miko.png", 
                txt: "あなたの前世は、人々に進むべき道を指し示した賢者や巫女。高い直感力と精神性は、その頃から引き継がれているようです。" 
            },
            green: { 
                title: "森を守る癒やし手", 
                img: "zense-iyashi.png", 
                txt: "あなたの前世は、薬草や自然の力で人々を救った癒やし手。今世で植物や動物に心惹かれるのは、その記憶があるからかもしれません。" 
            },
            blue: { 
                title: "自由を愛する旅人", 
                img: "zense-tabibito.png", 
                txt: "あなたの前世は、世界中を旅した自由奔放な冒険家。新しい場所や未知の体験に対する好奇心は、前世から譲り受けた宝物です。" 
            },
            gold: { 
                title: "誇り高き王族・貴族", 
                img: "zense-ou.png", 
                txt: "あなたの前世は、多くの人を導いた指導者や王族。華やかなオーラと決断力は、かつて国を動かしていた頃の名残でしょう。" 
            }
        };

        const questions = [
            { q: "直感で惹かれる色は？", a: { purple:"高貴な紫", green:"癒やしの緑", blue:"自由な青", gold:"輝く金" } },
            { q: "一番落ち着く場所はどこ？", a: { green:"深い森の中", blue:"波音のする海辺", gold:"豪華な宮殿", purple:"静かな寺院" } },
            { q: "無意識にやってしまうことは？", a: { gold:"リーダーシップを取る", green:"植物を育てる", purple:"星や宇宙を眺める", blue:"旅の計画を立てる" } },
            { q: "人から何と言われることが多い？", a: { green:"聞き上手だね", gold:"華があるね", blue:"個性的だね", purple:"ミステリアスだね" } }
        ];

        let current = 0; 
        let scores = { purple:0, green:0, blue:0, gold:0 };

        function showQuestion(){
            const q = questions[current]; 
            document.getElementById('q-number').innerText = `STEP ${current + 1} / ${questions.length}`;
            document.getElementById('question').innerText = q.q; 
            const o = document.getElementById('options'); 
            o.innerHTML = "";
            for (let k in q.a) { 
                const b = document.createElement("button"); 
                b.className = "button"; 
                b.innerText = q.a[k]; 
                b.onclick = () => { 
                    scores[k]++; 
                    current++; 
                    if (current < questions.length) showQuestion(); 
                    else startLoading(); 
                }; 
                o.appendChild(b); 
            }
        }

        function startLoading(){ 
            document.getElementById('quiz-screen').style.display = "none"; 
            document.getElementById('loading-screen').style.display = "block"; 
            showRandomAd('random', 'loading-ad-area'); 
            setTimeout(() => { document.getElementById("progress-bar").style.width = "100%"; }, 100); 
            setTimeout(() => { document.getElementById("result-view-btn").style.display = "block"; }, 3000); 
        }

        function showResult(){ 
            document.getElementById('loading-screen').style.display = "none"; 
            document.getElementById('result-screen').style.display = "block"; 
            
            // スコアが一番高いタイプを選ぶ
            const m = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b); 
            const d = results[m]; 
            
            document.getElementById('result-image').src = d.img; 
            document.getElementById('result-title').innerText = d.title; 
            document.getElementById('result-text').innerText = d.txt; 
            
            showRandomAd('love', 'result-ad-area'); 
        }
        
        showQuestion();
    </script>
</body>
</html>
