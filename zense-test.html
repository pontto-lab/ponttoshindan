<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👼 前世のあなたは何だった？ | ぽんっとラボ</title>
<style>
body { font-family:'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background:#fff; margin:0; padding:0; text-align:center; }
.wrapper { max-width:480px; margin:0 auto; padding:24px 16px; text-align:center; }
h1 { font-size:26px; margin-bottom:12px; color:#e67e22; }
.question { font-size:16px; margin:24px 0 12px; font-weight: bold; min-height: 3em; display: flex; align-items: center; justify-content: center; }
.options { display:flex; flex-direction:column; gap:10px; }
.options button { padding:14px; border-radius:18px; border:none; background:#fff9c4; box-shadow:0 4px 10px rgba(0,0,0,0.06); font-size:15px; cursor:pointer; transition:0.2s; color: #333; }
.options button:hover { transform: scale(1.03); background: #fff59d; }
.options button:active { transform: scale(0.97); }
#result { font-size:18px; margin-top:32px; }
#back { margin-top:20px; display:inline-block; padding:12px 24px; border-radius:16px; background:#e1f5fe; text-decoration:none; color:#333; font-weight: bold; border: 2px solid #81d4fa; }
#loading { font-size:24px; margin-top:32px; color:#e67e22; font-weight:bold; display:none; }
.result-name { font-size: 24px; color: #ff8f00; margin: 10px 0; font-weight: bold; }
</style>
</head>
<body>
<div class="wrapper">
<h1>👼 前世のあなたは何だった？</h1>

<div id="quiz">
<p class="question" id="question"></p>
<div id="options" class="options"></div>
</div>

<div id="loading">時空をさかのぼり中…⏳✨</div>
<div id="result"></div>
<a href="index.html" id="back" style="display:none;">🏠 ぽんっとTOPにもどる</a>
</div>

<script>
// 質問と、その質問に合った回答のセット（整合性を重視！）
const quizData = [
  {
    q: "森の奥で古い扉を見つけたよ。どうする？",
    a: [
      { t: "royal", text: "迷わず開けて中を確認する" },
      { t: "magic", text: "呪文を唱えて開けてみる" },
      { t: "free",  text: "風の向くままに通り過ぎる" },
      { t: "unique",text: "とりあえずノックして挨拶" }
    ]
  },
  {
    q: "夜空にひときわ輝く星が。あれは何だと思う？",
    a: [
      { t: "royal", text: "未来を導く王国の道しるべ" },
      { t: "magic", text: "伝説の魔力が宿る結晶" },
      { t: "free",  text: "自由な旅人を見守る瞳" },
      { t: "unique",text: "誰かが落とした光るアメ玉" }
    ]
  },
  {
    q: "目の前に不思議な宝石が。何色を選びたい？",
    a: [
      { t: "royal", text: "気品あふれる純金の色" },
      { t: "magic", text: "神秘的な深い紫色" },
      { t: "free",  text: "澄み渡る空のような青色" },
      { t: "unique",text: "キラキラ光る虹色" }
    ]
  },
  {
    q: "旅の途中で動物が話しかけてきたよ。何て言った？",
    a: [
      { t: "royal", text: "「お城への道を教えましょう」" },
      { t: "magic", text: "「不思議な力が目覚めています」" },
      { t: "free",  text: "「一緒に広い世界を見に行こう」" },
      { t: "unique",text: "「お腹すいたからパンちょうだい」" }
    ]
  },
  {
    q: "もし魔法がひとつだけ使えるなら？",
    a: [
      { t: "royal", text: "国を豊かにする魔法" },
      { t: "magic", text: "空を自在に飛ぶ魔法" },
      { t: "free",  text: "動物と心が通じる魔法" },
      { t: "unique",text: "一生お腹が空かない魔法" }
    ]
  }
];

const results = [
  { name:"誇り高き伝説の騎士⚔️", desc:"前世のあなたは、多くの人を守った英雄でした。その勇気は今も魂に刻まれています！" },
  { name:"月夜に踊る大魔法使い🧙‍♀️", desc:"不思議な力を操り、世界を旅していたあなた。今の直感の鋭さは、その時の名残かも。" },
  { name:"風と旅した自由な吟遊詩人🎶", desc:"どこにも縛られず、歌と共に生きたあなた。あなたの明るさは、周りの人を幸せにします。" },
  { name:"実は…とっても愛された子犬🐶", desc:"前世はみんなに可愛がられていたワンちゃんでした。愛され力は今世でも最強です！" }
];

let current = 0;
let scores = { royal:0, magic:0, free:0, unique:0 };
let quizOrder = [];

function initQuiz() {
  // 質問をシャッフル
  quizOrder = [...Array(quizData.length).keys()].sort(() => Math.random() - 0.5);
  showQuestion();
}

function showQuestion() {
  const data = quizData[quizOrder[current]];
  document.getElementById("question").innerText = data.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  // その質問用の回答をシャッフルして表示
  const shuffledA = [...data.a].sort(() => Math.random() - 0.5);

  shuffledA.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.text;
    btn.onclick = () => {
      scores[choice.t]++;
      nextQuestion();
    };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion() {
  current++;
  if (current < quizData.length) {
    showQuestion();
  } else {
    showLoading();
  }
}

function showLoading() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("loading").style.display = "block";
  setTimeout(showResult, 1500);
}

function showResult() {
  document.getElementById("loading").style.display = "none";
  let maxType = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
  
  let resultData;
  if (maxType === 'royal') resultData = results[0];
  else if (maxType === 'magic') resultData = results[1];
  else if (maxType === 'free') resultData = results[2];
  else resultData = results[3];

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = `
    <p style="font-size: 20px;">あなたの前世は…✨</p>
    <div class="result-name">${resultData.name}</div>
    <p style="line-height: 1.6;">${resultData.desc}</p>
  `;
  document.getElementById("back").style.display = "inline-block";
}

initQuiz();
</script>
</body>
</html>
