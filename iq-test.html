<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽんっとIQ診断 - ぽんっとラボ</title>
    <script src="ads-list.js"></script>
    <style>
        body { font-family: 'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }
        .button { display: inline-block; margin: 10px; padding: 15px; border-radius: 20px; background: #d8bfe6; color: #333; text-decoration: none; font-size: 18px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .button:active { transform: scale(0.9); }
        
        .ad-box { background: #fffafb; padding: 10px; border: 3px dashed #ffb6c1; margin: 20px 0; border-radius: 20px; min-height: 150px; }
        .ad-box img { width: 120px !important; height: 120px !important; border-radius: 10px; margin-bottom: 5px; }
        .ad-box a { text-decoration: none; color: #d2691e; font-size: 12px; font-weight: bold; }

        .progress-container { width: 100%; background: #eee; height: 15px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #progress-bar { width: 0%; background: #ff69b4; height: 100%; transition: width 3s linear; }
        
        #result-view-btn { display: none; width: 100%; background: #ff69b4; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        img { max-width: 100%; height: auto; }
        #question-number { font-weight: bold; color: #ff69b2; font-size: 1.2rem; margin-bottom: 10px; }
        .hint-text { color: #ff69b4; font-size: 14px; font-weight: bold; background: #fff0f5; padding: 10px; border-radius: 15px; margin: 10px 20px; border: 1px solid #ffb6c1; }

        #result-image { max-width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        .formula-container { display: flex; justify-content: center; align-items: center; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .formula-container img { width: 45px; } /* 8問用に見やすく少しサイズ調整 */
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 ぽんっとIQ診断</h1>
        
        <div id="game-screen">
            <p id="question-number"></p>
            <div id="quiz-area"></div>
        </div>

        <div id="ad-screen" style="display: none;">
            <h2 style="color: #ff1493;">採点が終わったよ！✨</h2>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div id="loading-ad-area" class="ad-box"></div>
            <button id="result-view-btn" class="button" onclick="showFinalResult()">💓 結果を見る 💓</button>
        </div>

        <div id="result-screen" style="display: none;">
            <h2 style="color: #ff1493;">診断結果発表！</h2>
            <img id="result-image" src="" alt="診断結果イラスト">
            <div id="iq-display" style="font-size: 44px; font-weight: bold; margin: 10px 0; background: white; padding: 20px; border-radius: 20px; border: 5px solid #ffb6c1;"></div>
            <p id="iq-comment" style="font-size: 20px; color: #555; line-height: 1.6; white-space: pre-wrap;"></p>
            <div id="result-ad-area"></div>
            <br>
            <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <a href="javascript:location.reload();" style="color:#ff69b4; text-decoration:none; font-weight:bold; font-size:16px;">🔄 もう一度診断する</a>
                <a href="index.html" class="button">🏠 ホームへ戻る</a>
            </div>
        </div>
    </div>

    <script>
        let currentStepIndex = 0;
        let score = 0;
        let fastAnswerCount = 0; 
        let startTime; 

        const opChoices = [
            { img: "plus.png", val: "+" },
            { img: "minus.png", val: "-" },
            { img: "kakeru.png", val: "x" },
            { img: "waru.png", val: "/" }
        ];

        const quizList = [
            { type: "normal", img: "question1.png", choices: [{img:"choice-a.png", ok:false}, {img:"choice-b.png", ok:true}, {img:"choice-c.png", ok:false}] },
            { type: "normal", img: "question2.png", choices: [{img:"choice-d.png", ok:false}, {img:"choice-f.png", ok:true}, {img:"choice-e.png", ok:false}] },
            { type: "normal", img: "question3.png", choices: [{img:"choice-g.png", ok:true}, {img:"choice-h.png", ok:false}, {img:"choice-i.png", ok:false}] },
            { type: "normal", img: "question4.png", choices: [{img: "choice-k.png", ok: false }, { img: "choice-l.png", ok: false }, { img: "choice-j.png", ok: true }], hint: "💡ヒント：3文字のことばを連想してね！" },
            { type: "normal", img: "question5.png", choices: [{ img: "choice-m.png", ok: true }, { img: "choice-n.png", ok: false }, { img: "choice-o.png", ok: false }] },
            { type: "normal", img: "question6.png", choices: [{ img: "choice-p.png", ok: false }, { img: "choice-q.png", ok: false }, { img: "choice-r.png", ok: true }] },
            { type: "calc", formula: ["10.png", "sikaku.png", "2.png", "minus.png", "5.png", "equal.png", "0.png"], correctOp: "/" },
            { type: "calc", formula: ["10.png", "waru.png", "2.png", "sikaku.png", "5.png", "equal.png", "0.png"], correctOp: "-" }
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const r = Math.floor(Math.random() * (i + 1));
                [array[i], array[r]] = [array[r], array[i]];
            }
            return array;
        }

        function showQuestion() {
            if (currentStepIndex >= quizList.length) { showAd(); return; }
            const q = quizList[currentStepIndex];
            document.getElementById('question-number').innerText = `第 ${currentStepIndex + 1} 問 / ${quizList.length}`;
            
            let html = "";
            if (q.type === "calc") {
                html += `<div class="formula-container">`;
                q.formula.forEach(item => { html += `<img src="${item}">`; });
                html += `</div>`;
                const shuffledOps = shuffle([...opChoices]);
                html += `<div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">`;
                shuffledOps.forEach(op => {
                    const isCorrect = (op.val === q.correctOp);
                    html += `<button onclick="handleAnswer(${isCorrect})" class="button" style="padding: 10px; background: white; border: 2px solid #ffb6c1;"><img src="${op.img}" width="70"></button>`;
                });
                html += `</div>`;
            } else {
                const shuffledChoices = shuffle([...q.choices]);
                html += `<img src="${q.img}" style="width: 100%; max-width: 400px; border-radius: 15px; margin-bottom: 25px; border: 3px solid #eee;">`;
                if (q.hint) { html += `<div class="hint-text">${q.hint}</div>`; }
                html += `<div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">`;
                shuffledChoices.forEach(c => {
                    html += `<button onclick="handleAnswer(${c.ok})" class="button" style="padding: 10px; background: white; border: 2px solid #ffb6c1;"><img src="${c.img}" width="90" style="display: block;"></button>`;
                });
                html += `</div>`;
            }
            document.getElementById('quiz-area').innerHTML = html;
            startTime = Date.now();
        }

        function handleAnswer(isCorrect) {
            const timeTaken = (Date.now() - startTime) / 1000;
            if (isCorrect) { 
                score++; 
                if (timeTaken <= 5) { fastAnswerCount++; }
            }
            currentStepIndex++;
            setTimeout(showQuestion, 300);
        }

        function showAd() {
            document.getElementById('game-screen').style.display = "none";
            document.getElementById('ad-screen').style.display = "block";
            showRandomAd('random', 'loading-ad-area');
            setTimeout(() => { document.getElementById("progress-bar").style.width = "100%"; }, 100);
            setTimeout(() => { document.getElementById("result-view-btn").style.display = "block"; }, 3000);
        }

        function showFinalResult() {
            document.getElementById('ad-screen').style.display = "none";
            document.getElementById('result-screen').style.display = "block";
            const iqDisp = document.getElementById('iq-display');
            const iqComm = document.getElementById('iq-comment');
            const iqImg = document.getElementById('result-image');
            
            let finalIQ;
            let resultImgFile = "";

            // 8問中の正解数で判定
            // スピードボーナス：3問以上で5秒以内
            const hasSpeedBonus = (fastAnswerCount >= 3);

            if (score === 8) { 
                finalIQ = hasSpeedBonus ? 140 : 130;
                resultImgFile = finalIQ === 140 ? "iq140.jpg" : "iq130.jpg";
            } else if (score >= 6) { 
                finalIQ = 115; resultImgFile = "iq115.jpg";
            } else if (score >= 4) { 
                finalIQ = 100; resultImgFile = "iq100.jpg";
            } else {
                finalIQ = 80; resultImgFile = "iq80.jpg";
            }

            iqImg.src = resultImgFile;
            iqDisp.innerText = "IQ " + finalIQ;
            
            if (finalIQ >= 130) { 
                iqComm.innerText = `超天才！✨\n全問正解おめでとう！\nあなたの脳はフル回転してるね💓`; 
            } else if (finalIQ >= 100) { 
                iqComm.innerText = `標準以上！💪\nナイスチャレンジ！\n安定した思考力の持ち主だよ✨`; 
            } else { 
                iqComm.innerText = `伸びしろたっぷり！🌱\n自分のペースで大丈夫。\nまた脳トレしにきてね！`; 
            }

            showRandomAd('health', 'result-ad-area');
        }
        showQuestion();
    </script>
</body>
</html>
