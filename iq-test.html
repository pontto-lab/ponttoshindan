<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽんっとIQ診断 - ぽんっとラボ</title>
    <script src="ads-list.js"></script>
    <style>
        body { font-family: 'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }
        .button { display: inline-block; margin: 8px; padding: 12px; border-radius: 20px; background: #d8bfe6; color: #333; text-decoration: none; font-size: 18px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .button:active { transform: scale(0.9); }
        .progress-container { width: 100%; background: #eee; height: 15px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #progress-bar { width: 0%; background: #ff69b4; height: 100%; transition: width 3s linear; }
        #result-view-btn { display: none; width: 100%; background: #ff69b4; color: white; animation: pulse 1.5s infinite; }
        .quiz-img { width: 100%; max-width: 100%; height: auto; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #question-number { font-weight: bold; color: #ff69b2; font-size: 1.2rem; margin-bottom: 10px; }
        .step-indicator { font-size: 14px; color: #ff69b4; font-weight: bold; margin-bottom: 10px; background: #fff0f5; display: inline-block; padding: 5px 15px; border-radius: 20px; }
        #result-image { max-width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .choice-btn { background: white !important; border: 3px solid #f9ebff !important; padding: 5px !important; }
        .choice-btn img { width: 80px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 ぽんっとIQ診断</h1>
        <div id="game-screen">
            <p id="question-number"></p>
            <div id="step-info" class="step-indicator" style="display:none;"></div>
            <div id="quiz-area"></div>
        </div>

        <div id="ad-screen" style="display: none;">
            <h2 style="color: #ff1493;">採点が終わったよ！✨</h2>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div id="loading-ad-area"></div>
            <button id="result-view-btn" class="button" onclick="showFinalResult()">💓 結果を見る 💓</button>
        </div>

        <div id="result-screen" style="display: none;">
            <h2 style="color: #ff1493;">診断結果発表！</h2>
            <img id="result-image" src="" alt="診断結果">
            <div id="iq-display" style="font-size: 44px; font-weight: bold; margin: 10px 0; background: white; padding: 20px; border-radius: 20px; border: 5px solid #ffb6c1;"></div>
            <p id="iq-comment" style="white-space: pre-wrap;"></p>
            <br>
            <a href="javascript:location.reload();" style="color:#ff69b4; text-decoration:none; font-weight:bold;">🔄 もう一度診断する</a>
        </div>
    </div>

    <script>
        let currentStepIndex = 0;
        let subStepIndex = 0; // 2回回答用
        let score = 0;
        let isCorrectSoFar = true; // 2ステップ問題で両方合ってるか

        const quizList = [
            { type: "single", img: "question1.png", choices: [{img:"choice-a.png", ok:false}, {img:"choice-b.png", ok:true}, {img:"choice-c.png", ok:false}] },
            { type: "single", img: "question2.png", choices: [{img:"choice-d.png", ok:false}, {img:"choice-f.png", ok:true}, {img:"choice-e.png", ok:false}] },
            { type: "single", img: "question3.png", choices: [{img:"choice-g.png", ok:true}, {img:"choice-h.png", ok:false}, {img:"choice-i.png", ok:false}] },
            { type: "single", img: "question4.png", choices: [{img:"choice-k.png", ok:false}, {img:"choice-l.png", ok:false}, {img:"choice-j.png", ok:true}] },
            { type: "single", img: "question5.png", choices: [{img:"choice-m.png", ok:true}, {img:"choice-n.png", ok:false}, {img:"choice-o.png", ok:false}] },
            { type: "single", img: "question6.png", choices: [{img:"choice-p.png", ok:false}, {img:"choice-q.png", ok:false}, {img:"choice-r.png", ok:true}] },
            
            // Q7：2段階回答（正解：× → +）
            { 
                type: "double", 
                img: "question7.png", 
                answers: ["kakeru", "plus"],
                choices: ["plus", "minus", "kakeru", "waru"] 
            },
            // Q8：2段階回答（正解：÷ → -）
            { 
                type: "double", 
                img: "question8.png", 
                answers: ["waru", "minus"],
                choices: ["plus", "minus", "kakeru", "waru"] 
            }
        ];

        function showQuestion() {
            if (currentStepIndex >= quizList.length) { showAd(); return; }
            const q = quizList[currentStepIndex];
            document.getElementById('question-number').innerText = `第 ${currentStepIndex + 1} 問 / ${quizList.length}`;
            
            const stepInfo = document.getElementById('step-info');
            if(q.type === "double") {
                stepInfo.style.display = "inline-block";
                stepInfo.innerText = `のこり ${2 - subStepIndex} つの空欄をうめてね！`;
            } else {
                stepInfo.style.display = "none";
            }

            let html = `<img src="${q.img}" class="quiz-img">`;
            html += `<div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">`;
            
            if(q.type === "single") {
                q.choices.forEach(c => {
                    html += `<button onclick="handleSingleAnswer(${c.ok})" class="button choice-btn"><img src="${c.img}"></button>`;
                });
            } else {
                q.choices.forEach(op => {
                    html += `<button onclick="handleDoubleAnswer('${op}')" class="button choice-btn"><img src="${op}.png"></button>`;
                });
            }
            html += `</div>`;
            document.getElementById('quiz-area').innerHTML = html;
        }

        function handleSingleAnswer(isCorrect) {
            if (isCorrect) score++;
            nextQuestion();
        }

        function handleDoubleAnswer(selectedOp) {
            const q = quizList[currentStepIndex];
            // 今のステップの正解と比較
            if (selectedOp !== q.answers[subStepIndex]) {
                isCorrectSoFar = false;
            }
            
            subStepIndex++;
            
            if (subStepIndex >= 2) {
                // 2回押し終わった
                if (isCorrectSoFar) score++;
                // リセットして次へ
                subStepIndex = 0;
                isCorrectSoFar = true;
                nextQuestion();
            } else {
                // 2回目があるなら表示だけ更新
                showQuestion();
            }
        }

        function nextQuestion() {
            currentStepIndex++;
            setTimeout(showQuestion, 300);
        }

        function showAd() {
            document.getElementById('game-screen').style.display = "none";
            document.getElementById('ad-screen').style.display = "block";
            setTimeout(() => { document.getElementById("progress-bar").style.width = "100%"; }, 100);
            setTimeout(() => { document.getElementById("result-view-btn").style.display = "block"; }, 3000);
        }

        function showFinalResult() {
            document.getElementById('ad-screen').style.display = "none";
            document.getElementById('result-screen').style.display = "block";
            const iqImg = document.getElementById('result-image');
            const iqDisp = document.getElementById('iq-display');
            const iqComm = document.getElementById('iq-comment');
            
            let finalIQ;
            if (score === 8) finalIQ = 140;
            else if (score >= 6) finalIQ = 115;
            else if (score >= 4) finalIQ = 100;
            else finalIQ = 80;

            iqDisp.innerText = "IQ " + finalIQ;
            iqImg.src = `iq${finalIQ}.jpg`;
            
            if (finalIQ >= 130) iqComm.innerText = "超天才！✨\n難しい計算パズルも完璧だったね！💓";
            else if (finalIQ >= 100) iqComm.innerText = "すごい！💪\n最後の方の問題もよく頑張ったね！✨";
            else iqComm.innerText = "お疲れ様！🌱\n計算パズル、次はもっと早く解けるかも！";
        }
        showQuestion();
    </script>
</body>
</html>
