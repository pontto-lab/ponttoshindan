<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽんっとIQ診断 - ぽんっとラボ</title>
    <style>
        body { font-family: 'ヒラギノ丸ゴ Pro','Arial Rounded MT Bold',sans-serif; background: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; }
        .button { display: inline-block; margin: 10px; padding: 15px; border-radius: 20px; background: #d8bfe6; color: #333; text-decoration: none; font-size: 18px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .button:active { transform: scale(0.95); }
        
        .ad-box { background: #fffafb; padding: 20px; border: 3px dashed #ffb6c1; margin: 20px 0; border-radius: 20px; }
        .progress-container { width: 100%; background: #eee; height: 15px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #progress-bar { width: 0%; background: #ff69b4; height: 100%; transition: width 3s linear; }
        
        #result-view-btn { display: none; width: 100%; background: #ff69b4; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        img { max-width: 100%; height: auto; }
        #question-number { font-weight: bold; color: #ff69b2; font-size: 1.2rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 ぽんっとIQ診断</h1>
        
        <div id="game-screen">
            <p id="question-number">第 1 問 / 6</p>
            <div id="quiz-area"></div>
        </div>

        <div id="ad-screen" style="display: none;">
            <h2 style="color: #ff1493;">採点が終わったよ！✨</h2>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div class="ad-box">
                <p style="font-size: 11px; color: #ff69b4; font-weight: bold; margin-bottom: 10px;">あなたのIQを算出中...広告をチェック！👇</p>
                <a href="//af.moshimo.com/af/c/click?a_id=5322069&p_id=54&pc_id=54&pl_id=1220" rel="nofollow" referrerpolicy="no-referrer-when-downgrade" attributionsrc><img src="//image.moshimo.com/af-img/0032/000000001220.gif" width="100%" height="auto" style="border:none; max-width: 468px;"></a><img src="//i.moshimo.com/af/i/impression?a_id=5322069&p_id=54&pc_id=54&pl_id=1220" width="1" height="1" style="border:none;" loading="lazy">
            </div>
            <button id="result-view-btn" class="button" onclick="showFinalResult()">💓 結果を見る 💓</button>
        </div>

        <div id="result-screen" style="display: none;">
            <h2 style="color: #ff1493;">診断結果発表！</h2>
            <div id="iq-display" style="font-size: 44px; font-weight: bold; margin: 20px 0; background: white; padding: 30px; border-radius: 20px; border: 5px solid #ffb6c1;"></div>
            <p id="iq-comment" style="font-size: 20px; color: #555; line-height: 1.6; white-space: pre-wrap;"></p>
            <br>
            <a href="index.html" class="button">ホームへ戻る</a>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let score = 0;
        let perfectSpeedBonus = true;
        let startTime; 
        const totalQuestions = 6; // 6問に設定

        const questions = {
            1: { img: "question1.png", choices: [{img:"choice-a.png", ok:false}, {img:"choice-b.png", ok:true}, {img:"choice-c.png", ok:false}] },
            2: { img: "question2.png", choices: [{img:"choice-d.png", ok:false}, {img:"choice-f.png", ok:true}, {img:"choice-e.png", ok:false}] },
            3: { img: "question3.png", choices: [{img:"choice-g.png", ok:true}, {img:"choice-h.png", ok:false}, {img:"choice-i.png", ok:false}] },
            4: { img: "question4.png", choices: [{img: "choice-k.png", ok: false }, { img: "choice-l.png", ok: false }, { img: "choice-j.png", ok: true }] },
            5: { img: "question5.png", choices: [{ img: "choice-m.png", ok: true }, { img: "choice-n.png", ok: false }, { img: "choice-o.png", ok: false }] },
            // トモちゃんの新問題！
            6: { img: "question6.png", choices: [{ img: "choice-p.png", ok: true }, { img: "choice-q.png", ok: false }, { img: "choice-r.png", ok: false }] }
        };

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const r = Math.floor(Math.random() * (i + 1));
                [array[i], array[r]] = [array[r], array[i]];
            }
            return array;
        }

        function showQuestion() {
            const q = questions[currentStep];
            if (!q || currentStep > totalQuestions) { showAd(); return; }
            document.getElementById('question-number').innerText = `第 ${currentStep} 問 / ${totalQuestions}`;
            const shuffledChoices = shuffle([...q.choices]);
            let html = `<img src="${q.img}" style="width: 100%; max-width: 400px; border-radius: 15px; margin-bottom: 25px; border: 3px solid #eee;">`;
            html += `<div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">`;
            shuffledChoices.forEach(c => {
                html += `<button onclick="nextQuestion(${c.ok})" class="button" style="padding: 10px; background: white; border: 2px solid #ffb6c1;"><img src="${c.img}" width="90" style="display: block;"></button>`;
            });
            html += `</div>`;
            document.getElementById('quiz-area').innerHTML = html;
            startTime = Date.now();
        }

        function nextQuestion(isCorrect) {
            const timeTaken = (Date.now() - startTime) / 1000;
            if (isCorrect) { 
                score++; 
                if (timeTaken > 8) perfectSpeedBonus = false;
            } else {
                perfectSpeedBonus = false;
            }
            currentStep++;
            setTimeout(() => { showQuestion(); }, 300);
        }

        function showAd() {
            document.getElementById('game-screen').style.display = "none";
            document.getElementById('ad-screen').style.display = "block";
            setTimeout(() => { document.getElementById("progress-bar").style.width = "100%"; }, 100);
            setTimeout(() => { document.getElementById("result-view-btn").style.display = "block"; }, 3000);
        }

        function showFinalResult() {
            document.getElementById('ad-screen').style.display = "none";
            document.getElementById('result-screen').style.display = "block";
            const iqDisp = document.getElementById('iq-display');
            const iqComm = document.getElementById('iq-comment');
            
            let finalIQ;
            if (score === 6) { finalIQ = perfectSpeedBonus ? 140 : 130; }
            else if (score === 5) { finalIQ = 115; }
            else if (score === 4) { finalIQ = 100; }
            else if (score === 3) { finalIQ = 85; }
            else { finalIQ = 70; }

            iqDisp.innerText = "IQ " + finalIQ;

            if (finalIQ >= 130) { iqComm.innerText = "超天才！✨\n全問正解おめでとう！\nあなたの論理的思考力は、\nプロも驚くレベルだね💓"; }
            else if (finalIQ >= 100) { iqComm.innerText = "優秀！💪\nひらめき力が鋭いね！\n自信を持っていいレベルだよ✨"; }
            else { iqComm.innerText = "伸びしろたっぷり！🌱\n今日は脳が少しお疲れかも？\nまた明日挑戦してみてね！"; }
        }

        showQuestion();
    </script>
</body>
</html>
